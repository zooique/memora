# Memora 宿主（VS Code 插件）Release 流水线：打 `vscode@X.Y.Z` tag → 宿主门禁 → 出 vsix → 挂 GitHub Release
#
# 触发：推送形如 `vscode@X.Y.Z` 的 tag（如 `vscode@0.2.0`）；或 workflow_dispatch 手动预演
#   （dry-run——门禁全跑到打包为止，不挂 Release）。
#   与内核 release.yml（挂 `v*`，发 npm）**互不干扰**——ADR-033 双版本线：
#   内核 `v*` 一轴、宿主 `vscode@*` 一轴，两轴门禁不同、产物不同、节奏有先后。
#
# ⚠️ 为什么**不复用**内核 release.yml（本仓库另一个 workflow）：
#   两者**门禁范围不同**——内核跑内核测试；宿主除了自身测试外，还依赖「内核 dist 先构建」
#   （宿主 bundle 由 esbuild **内联**内核 dist）。塞进一个文件会长出一堆 `if:` 分支，
#   且失败语义混乱（宿主红要不要挡住内核发版？）。
#   更要紧的是：内核那条链已于 2026-10-23 跑通 5.0.0，**动它就有回归风险**——
#   不为省一个文件去改一条刚验证过的发布链。
#
# 门禁范围（与内核 release.yml 对齐，另加一条宿主专属的前置护栏）：
#   ① tag ↔ hosts/memora-vscode/package.json version 一致（防打错 tag：市场与 Release 均不可同版本覆盖）；
#   ② **内核已先行发布到 npm**（宿主专属，见下方步骤注释）；
#   ③ format:check / typecheck / lint / 单元测试（串行）/ 打包。
#
# 分发出口（按 2026-10-23 调研结论定案，勿一次全上）：
#   ① **GitHub Release asset**（本 workflow 已带）——零外部账号门槛，今天就能用；
#   ② **Open VSX**——✅ 已开通（2026-10-26）：namespace ownership / 手动首发 0.2.0 /
#      Trusted Publisher 登记均已完成，本 workflow 末尾两步即「发布 + 回查」（OIDC 零密钥）。
#      ⚠️ 版本号在 Open VSX 上**永久保留**（删除后仍保留，同一版本永不能再发）
#      ⇒ 每次发版**必须先升** hosts/memora-vscode/package.json 的 version。
#      这是 tag↔version 闸之外的第二道硬约束：已发的 0.2.0 若再打一次 tag，
#      门禁全绿、Release 也能挂，但 Open VSX 那步必红。
#   ③ **VS Code Marketplace**——🔒 **定案：保持手动上传，CI 路线放弃**。
#      ⚠️ 全局 PAT 于 **2026-12-01 退役**（仅剩约 6 周），搭 PAT 自动发布即搭即拆；
#      稳的 Entra ID 路线需要 Azure 订阅 ⇒ 重新触发已撞过的「国外银行卡」拦路石；
#      干净路线 `vsce publish --oidc` 尚未进稳定版且 Marketplace 侧无策略注册 UI，
#      现不可用。手动上传已验证（0.1.0 上架），每版传一次 .vsix，成本可忽略 ⇒ 手动最优。
#
# ⚠️ 改名红线：Open VSX 的 Trusted Publishers 按 **workflow 文件名**匹配（按名字，非数字 ID）
#   ⇒ 本文件 `host-release.yml` 一旦在 Open VSX 注册，**不得改名**（改名必须删掉注册重来）。

name: Host Release → GitHub Release

on:
  push:
    tags:
      - 'vscode@*'
  # 手动预演（dry-run）：从 main 触发，跑全部门禁到打包为止，**不挂 Release**（上传步有
  # `if: github.event_name == 'push'` 闸）。tag 前空跑一次，可提前暴露 CI 冷环境差异——
  # 0.2.0 两次首跑缺陷（冷 store --offline 炸 / ubuntu 平台差异红）本可这样提前暴露，
  # 省掉「删 tag 重打」两轮往返。可选 input 核对版本号，留空则只跑门禁。
  workflow_dispatch:
    inputs:
      expected_version:
        description: '可选：核对 hosts/memora-vscode/package.json 版本（留空 = 只跑门禁）'
        required: false
        default: ''

permissions:
  # contents: write —— 创建 Release 并上传 vsix asset 需要
  contents: write
  # id-token: write —— 预留给 Open VSX Trusted Publishing（出口②开通后即生效，无需改权限）
  id-token: write

jobs:
  release:
    name: 宿主门禁 + 出 vsix + 挂 Release
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm（读取 packageManager 字段，避免版本冲突）
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖（根）
        run: pnpm install --frozen-lockfile

      - name: 校验 tag 与宿主 package.json version 一致
        run: |
          PKG=$(node -p "require('./hosts/memora-vscode/package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动预演：无 tag 上下文（GITHUB_REF_NAME = 触发分支名），tag 一致性无意义；
            # input 填了才做版本断言，留空只跑门禁。
            EXPECT="${{ github.event.inputs.expected_version }}"
            echo "手动预演：宿主 package.json.version=$PKG（无 tag 上下文，跳过 tag 一致性校验）"
            if [ -n "$EXPECT" ] && [ "$EXPECT" != "$PKG" ]; then
              echo "::error::expected_version=$EXPECT 与宿主 package.json version $PKG 不一致。"
              exit 1
            fi
          else
            TAG="${GITHUB_REF_NAME#vscode@}"
            echo "tag=vscode@$TAG  宿主 package.json.version=$PKG"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::tag vscode@$TAG 与宿主 package.json version $PKG 不一致，终止发布（打错 tag 时请删 tag 重打，不要改 package.json 迁就）。"
              exit 1
            fi
          fi

      # 「内核先行、宿主跟进」节奏机制化（ADR-033 双版本线）：
      #   宿主 bundle 由 esbuild **内联**内核 dist ⇒ 产物里带的是本地构建的内核代次。
      #   若内核未先发 npm，市场/Release 上就会出现「宿主依赖一个 npm 上不存在的内核版本」——
      #   这类错误不会在宿主门禁里暴露（宿主测试跑的是本地 dist，天然同代），只能靠此闸拦。
      #   判据 = 根 package.json 的 version 必须已是 npm 上的 latest。
      - name: 校验内核已先行发布到 npm
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          NPM=$(npm view @zooique/memora version)
          echo "本地内核版本=$LOCAL  npm latest=$NPM"
          if [ "$LOCAL" != "$NPM" ]; then
            echo "::error::内核未先行发布：本地 $LOCAL ≠ npm latest $NPM —— 宿主 bundle 会内联一个 npm 上不存在的内核代次，终止。请先发内核（打 v$LOCAL tag）。"
            exit 1
          fi

      - name: 格式检查
        run: npm run format:check

      # 宿主 compile 由 esbuild 内联内核 dist ⇒ 内核必须先构建，且版本号须与 npm 一致（上一步已校验）
      - name: 构建内核 dist
        run: npm run build

      # 跨宿主契约测试（crossHostLayout）前置：mcp 侧 dist 必须存在且新鲜（该测试加载的是
      # 构建产物而非源码，见其文件头注释；mcp 依赖 file:../.. 内核，故排在内核 dist 之后）。
      # memora-mcp 尚未独立发版 ⇒ 无 lockfile，只能 --no-frozen-lockfile（SDK 版本浮动；
      # mcp 出包补 lockfile 后应收紧为 --frozen-lockfile）。
      - name: 构建 memora-mcp dist（跨宿主契约测试前置）
        run: |
          pnpm install --no-frozen-lockfile
          npm run build
        working-directory: hosts/memora-mcp

      # 内核 dist 变更后必须重链：宿主 vitest 会加载旧的硬链接副本，不刷新会测到上一代内核。
      # ⚠️ 不能用 --offline：根与宿主是两个独立 pnpm 工程（无 workspace），上游步骤只装了根依赖，
      #   冷 store 缺宿主 lockfile 独有的 ~187 个包（vsce/@vscode 系），offline 解析必炸
      #   （2026-10-23 vscode@0.2.0 首跑实证）。本地能 --offline 是因为 store 已暖，CI 冷环境不行。
      - name: 宿主依赖安装 + 内核 dist 重链
        run: pnpm install --frozen-lockfile
        working-directory: hosts/memora-vscode

      - name: 宿主 TypeScript 类型检查
        run: npm run typecheck
        working-directory: hosts/memora-vscode

      - name: 宿主 ESLint
        run: npm run lint
        working-directory: hosts/memora-vscode

      - name: 宿主单元测试（串行，贴合本地真形态，避免 I/O 假红）
        run: npm run test
        working-directory: hosts/memora-vscode

      - name: 打包 vsix
        run: npm run package
        working-directory: hosts/memora-vscode

      # 产物带版本号重命名：Release asset 若固定叫 memora-vscode.vsix，用户下载后分不清版本。
      # 只改 CI 侧产物名，不动 npm run package 的 --out（本地流程与 .gitignore 的 *.vsix 保持不变）。
      - name: 产物带版本号 + 完整性核对
        id: artifact
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#vscode@}"
          SRC=hosts/memora-vscode/memora-vscode.vsix
          if [ ! -s "$SRC" ]; then
            echo "::error::打包产物缺失或为空：$SRC"
            exit 1
          fi
          DST="hosts/memora-vscode/memora-vscode-${VER}.vsix"
          mv "$SRC" "$DST"
          echo "file=$DST" >> "$GITHUB_OUTPUT"
          echo "name=memora-vscode-${VER}.vsix" >> "$GITHUB_OUTPUT"
          SHA=$(sha256sum "$DST" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA"
          echo "size=$(wc -c < "$DST") bytes"

      # 幂等：Release 已存在则改用 upload（--clobber 覆盖同名 asset）。
      # ⇒ 同一 tag 重跑不会因「Release 已存在」而炸（CI 重跑安全）。
      # 手动预演（workflow_dispatch）到此为止：门禁全跑、vsix 已打包，但不创建/更新任何 Release。
      # body 结构化（0.2.0 实证缺口：--generate-notes 只剩 auto changelog 链接，
      # 「随包内核代次」这条用户对账信息在发布面丢失）——--notes-file 正文 + --generate-notes 追加。
      - name: 上传 vsix 到 GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#vscode@}"
          FILE="${{ steps.artifact.outputs.file }}"
          KERNEL=$(node -p "require('./package.json').version")
          NOTES=$(mktemp)
          {
            echo "> **随包内核代次 = \`@zooique/memora@${KERNEL}\`**（esbuild 内联 dist；内核自身变更见内核 CHANGELOG 区）。"
            echo "> 产物完整性：sha256 = \`${{ steps.artifact.outputs.sha256 }}\`（$(wc -c < "$FILE") 字节）。"
            echo "> 安装：下载 .vsix 后 \`code --install-extension memora-vscode-${VER}.vsix\`；VS Code Marketplace 按定案保持手动上传，上架状态以市场为准。"
          } > "$NOTES"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 覆盖上传同名 asset"
            gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" "$FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "VS Code 宿主插件 ${VER}" \
              --notes-file "$NOTES" \
              --generate-notes
          fi

      # ── 出口②：Open VSX（Trusted Publishing，OIDC 零密钥）─────────────────────────
      #
      # 前置（2026-10-26 复核，均已在 open-vsx.org 完成，缺一即失败）：
      #   ① Publisher Agreement 已签；② namespace `zooique` 已 verified（owner，非仅 contributor）；
      #   ③ 扩展已有 active 版本（0.2.0 于 2026-10-23 手动首发；**首发不能用 OIDC**）；
      #   ④ 已登记 Trusted Publisher（GitHub Actions / zooique / memora / host-release.yml）。
      #
      # ⚠️ 为什么**传产物路径**而不是裸跑 `npx ovsx publish --trusted-publishing`：
      #   ① 裸跑 = ovsx 用 vsce 在**当前目录重新打包再发布** ⇒ 发出去的是源码现打的产物，
      #      与上面过了门禁、算了 sha256、挂进 Release 的那个 vsix **不是同一个文件**；
      #   ② ovsx README 明示：打包由 vsce 走依赖遍历，**只支持 npm / yarn v1，pnpm 不受支持**
      #      （要绕开得 --no-dependencies / --follow-symlinks）——本仓库正是 pnpm，重打包必踩。
      #   ⇒ 传 <file> = 直接上传已打包文件（README: "publishes an already packaged file"），两条都绕开。
      #
      # ⚠️ 为什么必须 `if: push`：Open VSX 的 Trusted Publisher 注册**不绑定分支或 tag**——
      #   「任何跑这个 workflow 文件的 ref 都被信任」。workflow_dispatch 预演若无此闸，
      #   手动点一次就真发到公开市场，而**版本号一旦占用不可回收**。
      #
      # ⚠️ 为什么锁 ovsx@1.3.0：发布链不该被上游 minor 变更偷袭（CLI 参数/默认行为漂移）。
      #   用 npx 而非加 devDependency——后者要动 pnpm-lock，而 CI 用 --frozen-lockfile。
      - name: 发布到 Open VSX（Trusted Publishing · OIDC 零密钥）
        if: github.event_name == 'push'
        env:
          VSIX: ${{ steps.artifact.outputs.file }}
        run: npx --yes ovsx@1.3.0 publish "$VSIX" --trusted-publishing

      # 发布后回查：ovsx 退出码 0 只代表上传被接受，不代表市场已生效（入库延迟无法自证）。
      # 故回读 registry API 断言 latest == 本次 tag 版本；最多等 10 分钟（30 次 × 20 秒）。
      #
      # ⚠️ 为什么不是 100 秒（2026-10-26 实测，0.3.0 那笔）：上传被接受后市场仍显示旧版本，
      #   等满 100 秒窗口退出 1，而再过一会儿 registry 已是 0.3.0 ⇒ 门禁「假红」，
      #   红的是判据窗过短，不是发布失败。入库延迟不可控，判据只能放宽到实测上限之外。
      - name: 核对 Open VSX 上版本已生效
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#vscode@}"
          for i in $(seq 1 30); do
            GOT=$(curl -fsS https://open-vsx.org/api/zooique/memora-vscode | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version' || echo '')
            if [ "$GOT" = "$VER" ]; then
              echo "Open VSX: zooique.memora-vscode = $VER"
              exit 0
            fi
            echo "第 $i 次回查：市场仍为 '$GOT'（期望 $VER），20 秒后重试"
            sleep 20
          done
          echo "::error::Open VSX 上未见到 $VER（发布步未报错但市场未更新）——人工核对 https://open-vsx.org/extension/zooique/memora-vscode"
          exit 1
