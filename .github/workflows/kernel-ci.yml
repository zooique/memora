# Memora 内核 CI 流水线
#
# 触发条件：
#   1. 推送到 main/master 分支
#   2. 拉取请求（PR）
#   3. 手动触发
#
# 检查项：
#   - TypeScript 类型检查（tsc --noEmit）
#   - ESLint 代码规范检查
#   - Vitest 单元测试（1372 用例）
#   - 生产构建（tsc + tsc-alias）
#
# 说明：内核是纯逻辑库，零 native 依赖，
#   仅需 ubuntu-latest + Node.js 22 LTS 即可完成全部检查。

name: Kernel CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ─── 内核质量门禁 ──────────────────────────────────────────
  kernel-quality:
    name: Kernel Typecheck + Lint + Test + Build
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: ESLint 代码规范检查
        run: npm run lint

      - name: 单元测试
        run: npm test

      - name: 生产构建验证
        run: npm run build

      - name: 上传构建产物（验证用，非发布）
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dist
          path: dist/
          retention-days: 7
