# Memora 内核 CI 流水线
#
# 触发条件：
#   - 推送到 main/master 分支  ← 大改期间暂停（2026-08-27），见下方注释
#   - 拉取请求（PR）            ← 大改期间暂停（2026-08-27），见下方注释
#   - 手动触发（workflow_dispatch） ← 保留，随时可恢复 CI
#
# 检查项：
#   - TypeScript 类型检查（tsc --noEmit）
#   - ESLint 代码规范检查
#   - Vitest 单元测试（2337 用例）
#   - 生产构建（tsc + tsc-alias）
#
# 说明：内核是纯逻辑库，零 native 依赖，
#   仅需 ubuntu-latest + Node.js 22 LTS 即可完成全部检查。
#   CI 验证不需要上传产物（节省 Actions 存储配额），
#   如需发布请使用专门的 Release 工作流。
#
# 零残留策略（2026-09-14）：本流水线「只跑门禁，不产出任何持久资产」——
#   ① 只读权限（permissions: contents: read）② 不使用 Actions Cache
#   ③ 不 upload-artifact ④ 不创建 Release。
#   动机：历史上 Sprite 打包流水线（已在 81468568 删除的 build.yml）会上传
#   Electron 安装包（.exe/.zip，百 MB 级）+ Electron 二进制缓存（数百 MB–1GB）
#   + 跨仓 Release（永久不过期），三者叠加把 GitHub 存储配额塞满。
#   内核 CI 无任何需要留存的产物 → 从机制上排除这一类残留。

name: Kernel CI

on:
  # 大改期间暂停自动触发（2026-08-27）：内核分层分轨重构进行中，避免 CI 频繁红；
  # 恢复时取消注释下方两段即可（保留 workflow_dispatch 手动触发随时可用）。
  # push:
  #   branches:
  #     - main
  #     - master
  # pull_request:
  #   branches:
  #     - main
  #     - master
  workflow_dispatch:

# 只读权限：杜绝任何写（仓库内容 / packages / releases）。
# 即使未来误加写入类 action，也会因权限不足而失败，而非静默产生残留。
permissions:
  contents: read

jobs:
  # ─── 内核质量门禁 ──────────────────────────────────────────
  kernel-quality:
    name: Kernel Typecheck + Lint + Test + Build
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        # 不指定 version，让 action 自动读取 package.json 的 packageManager 字段，
        # 避免与 pnpm@10.29.2+sha512... 冲突（ERR_PNPM_BAD_PM_VERSION）

      - name: 安装 Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 刻意不启用 cache: 'pnpm' —— 本流水线零残留策略：不写 GitHub Actions Cache。
          # 代价 = 每次重新 pnpm install（零依赖内核约 1–2 分钟）；收益 = 运行后无任何持久残留。
          # cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: ESLint 代码规范检查
        run: npm run lint

      - name: 单元测试
        run: npm test

      - name: 依赖安全审计
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 生产构建验证
        run: npm run build
