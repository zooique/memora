# Memora 内核 CI 流水线
#
# ⚠️ 大改期暂停自动触发（2026-08-18）：
#   PersonaManager → RolePackManager 过渡期清理期间，CI 会持续因破坏性变更报错。
#   恢复方式：将 on.push / on.pull_request 取消注释，移除 workflow_dispatch-only 标记。
#
# 触发条件：
#   - 手动触发（workflow_dispatch）
#   - [已暂停] 推送到 main/master 分支
#   - [已暂停] 拉取请求（PR）
#
# 检查项：
#   - TypeScript 类型检查（tsc --noEmit）
#   - ESLint 代码规范检查
#   - Vitest 单元测试（1372 用例）
#   - 生产构建（tsc + tsc-alias）
#
# 说明：内核是纯逻辑库，零 native 依赖，
#   仅需 ubuntu-latest + Node.js 22 LTS 即可完成全部检查。

name: Kernel CI

on:
  # push:        # [已暂停] 大改期结束后恢复
  #   branches:
  #     - main
  #     - master
  # pull_request: # [已暂停] 大改期结束后恢复
  #   branches:
  #     - main
  #     - master
  workflow_dispatch:

jobs:
  # ─── 内核质量门禁 ──────────────────────────────────────────
  kernel-quality:
    name: Kernel Typecheck + Lint + Test + Build
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        # 不指定 version，让 action 自动读取 package.json 的 packageManager 字段，
        # 避免与 pnpm@10.29.2+sha512... 冲突（ERR_PNPM_BAD_PM_VERSION）

      - name: 安装 Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: ESLint 代码规范检查
        run: npm run lint

      - name: 单元测试
        run: npm test

      - name: 依赖安全审计
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 生产构建验证
        run: npm run build

      - name: 上传构建产物（验证用，非发布）
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dist
          path: dist/
          retention-days: 3
