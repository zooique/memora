# Memora Sprite 自动化构建流水线
#
# 触发条件：
#   1. 推送 v* 格式的 tag → 仅 Windows 自动构建打包
#   2. 手动触发（workflow_dispatch）→ 可选 Windows / macOS / Linux
#
# 产物：
#   - Windows: Memora-Sprite-win-x64.zip + NSIS 安装包（.exe） ← 主要分发格式
#   - macOS:   Memora-Sprite-mac-x64.zip + DMG（仅手动，未签名需自行处理 Gatekeeper）
#   - Linux:   Memora-Sprite-linux-x64.zip（仅手动）
#
# 缓存策略：
#   - npm 缓存（按 package-lock.json 哈希）
#   - electron 二进制缓存（按 electron 版本）
#   - electron-builder 缓存

name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: '目标平台（all/win/mac/linux）'
        required: false
        default: 'all'

jobs:
  # ─── Windows 构建 ──────────────────────────────────────────
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'win' || github.event_name == 'push'
    defaults:
      run:
        working-directory: hosts/memora-sprite

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: hosts/memora-sprite/package-lock.json

      - name: 缓存 Electron 二进制
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('hosts/memora-sprite/package.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: 安装依赖
        run: npm ci

      - name: 安装根目录依赖（内核编译所需）
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: 同步内核 memora（编译内核到 node_modules/memora）
        run: npm run sync-memora

      - name: 类型检查
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: 类型检查（Web 模式）
        run: npx tsc -p tsconfig.web.json --noEmit

      - name: Lint 检查
        run: npm run lint

      - name: 单元测试
        run: npx vitest run

      - name: 依赖安全审计
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 打包 Windows
        run: npm run package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ~\AppData\Local\electron\Cache
          ELECTRON_BUILDER_CACHE: ~\AppData\Local\electron-builder\Cache

      - name: 上传产物
        uses: actions/upload-artifact@v5
        with:
          name: memora-sprite-win-x64
          path: |
            hosts/memora-sprite/release/*.zip
            hosts/memora-sprite/release/*.exe
          retention-days: 30

  # ─── macOS 构建 ────────────────────────────────────────────
  build-macos:
    name: Build macOS (x64 + arm64)
    runs-on: macos-latest
    # 暂不自动构建 macOS（未签名会被 Gatekeeper 拦），仅手动触发时可用
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'mac')
    defaults:
      run:
        working-directory: hosts/memora-sprite

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: hosts/memora-sprite/package-lock.json

      - name: 缓存 Electron 二进制
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('hosts/memora-sprite/package.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: 安装依赖
        run: npm ci

      - name: 安装根目录依赖（内核编译所需）
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: 同步内核 memora（编译内核到 node_modules/memora）
        run: npm run sync-memora

      - name: 类型检查
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: 类型检查（Web 模式）
        run: npx tsc -p tsconfig.web.json --noEmit

      - name: Lint 检查
        run: npm run lint

      - name: 单元测试
        run: npx vitest run

      - name: 依赖安全审计
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 打包 macOS
        run: npm run package:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ~/Library/Caches/electron
          ELECTRON_BUILDER_CACHE: ~/Library/Caches/electron-builder

      - name: 上传产物
        uses: actions/upload-artifact@v5
        with:
          name: memora-sprite-mac
          path: |
            hosts/memora-sprite/release/*.zip
            hosts/memora-sprite/release/*.dmg
          retention-days: 30

  # ─── Linux 构建 ────────────────────────────────────────────
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    # 暂不自动构建 Linux（暂无用户需求），仅手动触发时可用
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux')
    defaults:
      run:
        working-directory: hosts/memora-sprite

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: hosts/memora-sprite/package-lock.json

      - name: 缓存 Electron 二进制
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('hosts/memora-sprite/package.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: 安装依赖
        run: npm ci

      - name: 安装根目录依赖（内核编译所需）
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: 同步内核 memora（编译内核到 node_modules/memora）
        run: npm run sync-memora

      - name: 类型检查
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: 类型检查（Web 模式）
        run: npx tsc -p tsconfig.web.json --noEmit

      - name: Lint 检查
        run: npm run lint

      - name: 单元测试
        run: npx vitest run

      - name: 依赖安全审计
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 打包 Linux
        run: npm run package:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ~/.cache/electron
          ELECTRON_BUILDER_CACHE: ~/.cache/electron-builder

      - name: 上传产物
        uses: actions/upload-artifact@v5
        with:
          name: memora-sprite-linux-x64
          path: hosts/memora-sprite/release/*.zip
          retention-days: 30

  # ─── 发布 Release ──────────────────────────────────────────
  # 闭源发布策略：源码在私有镜像仓，产物发布到独立公开发布仓 memora-sprite-releases
  # 用户需先配置 secret RELEASE_TOKEN（GitHub 细粒度 PAT，仅公开仓 memora-sprite-releases 的 Contents:write），见发布流程文档 §4
  release:
    name: Publish Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: 列出下载的产物（诊断用）
        run: |
          echo "=== 产物列表 ==="
          find artifacts -type f -exec ls -lh {} \;
          echo "=== 产物总数 ==="
          find artifacts -type f | wc -l

      - name: 验证 RELEASE_TOKEN 已配置
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "❌ RELEASE_TOKEN 未配置！请在私有镜像仓 Settings → Secrets → Actions 添加"
            exit 1
          fi
          echo "✓ RELEASE_TOKEN 已配置（长度: ${#RELEASE_TOKEN}）"

      - name: 发布到公开发布仓 memora-sprite-releases
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository_owner }}/memora-sprite-releases
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*
