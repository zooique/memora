# Dependabot 依赖自动更新配置
#
# 监控两个 npm package：
#   1. 内核（根目录 /）
#   2. 精灵宿主（hosts/memora-sprite/）
#
# 策略：
#   - 每周一检查更新
#   - npm ecosystem 自动创建 PR
#   - major 版本单独分组（避免一次性升级多个 major）
#   - 安全更新优先（GitHub 自动创建安全 PR）

version: 2

updates:
  # ─── 内核依赖（根目录） ──────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - kernel
    groups:
      # devDependencies 的小版本更新合并为一个 PR
      dev-dependencies-minor:
        dependency-type: development
        update-types:
          - minor
          - patch

  # ─── 精灵宿主依赖 ──────────────────────────────────
  - package-ecosystem: npm
    directory: /hosts/memora-sprite
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps-sprite)
    labels:
      - dependencies
      - sprite
    groups:
      dev-dependencies-minor:
        dependency-type: development
        update-types:
          - minor
          - patch

  # ─── GitHub Actions 版本监控 ────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci)
    labels:
      - dependencies
      - ci
