<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSP：允许内联脚本与样式（浮动窗口为独立小窗口，无外部资源） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Memora 精灵</title>
  <style>
    /* ===== 全局重置 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-app-region: no-drag;  /* 拖动由鼠标事件手动处理，避免吞掉单击 */
    }

    /* ===== 浮动窗口主体（80x80 透明背景） ===== */
    body {
      width: 80px;
      height: 80px;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    /* ===== 精灵球体（蓝粉渐变 + 阴影 + 过渡） ===== */
    #sphere {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      /* 蓝粉渐变：对齐 docs/memora-sprite-preview.html 的 .float-icon-demo */
      background: linear-gradient(135deg, #89b4fa 0%, #f5c2e7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      box-shadow: 0 8px 24px rgba(137, 180, 250, 0.4);
    }

    /* 悬停：轻微放大 */
    #sphere:hover {
      transform: scale(1.08);
    }

    /* 拖动中：缩小 + 半透明 */
    #sphere.dragging {
      transform: scale(0.95);
      opacity: 0.8;
    }

    /* 主动提示弹跳动画（对齐 HTML 预览 @keyframes floatBounce） */
    /* UI-AE-02 弱化弹跳幅度：12px→6px，与专注模式基调一致 */
    #sphere.bounce {
      animation: floatBounce 0.5s ease;
    }
    @keyframes floatBounce {
      0%, 100% { transform: translateY(0); }
      40%  { transform: translateY(-6px); }
      70%  { transform: translateY(-2px); }
    }

    /* ===== 状态指示点（右下角，对齐 HTML 预览 .float-status-dot） ===== */
    #status-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--bg);  /* 与背景同色，形成镂空效果 */
      background: var(--green);  /* 默认 idle 绿色 */
    }

    /* active 状态：蓝色 + 脉冲动画 */
    #status-dot.active {
      background: var(--accent);
      animation: dotPulse 1.5s infinite;
    }
    @keyframes dotPulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--accent-20); }
      50% { box-shadow: 0 0 0 6px transparent; }
    }

    /* sleeping 状态：黄色月牙 */
    #status-dot.sleeping {
      background: var(--yellow);
    }

    /* UI-AE-02 prefers-reduced-motion：尊重用户系统偏好 */
    @media (prefers-reduced-motion: reduce) {
      #sphere.bounce {
        animation: none;
      }
      #status-dot.active {
        animation: none;
      }
    }

    /* ===== 未读计数徽章（右上角，对齐 HTML 预览 .float-unread-badge） ===== */
    #badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      background: #f38ba8;
      color: #1e1e2e;
      font-size: 0.7rem;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      border: 2px solid #1e1e2e;
    }

    #badge.visible {
      display: flex;
    }

    /* ===== 阶段三形态进化预留：图片加载容器 ===== */
    #sphere-form {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #sphere-form img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;  /* 阶段二不显示图片，仅预留接口 */
    }

    /* ===== FD-06 拖动引导提示（首次使用） ===== */
    /* 新用户不知道浮动窗口可以拖动，首次悬停时显示引导提示 */
    #drag-hint {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 46, 0.95);
      color: #cdd6f4;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    #drag-hint.visible {
      opacity: 1;
    }

    /* 引导提示小箭头（指向球体） */
    #drag-hint::before {
      content: '';
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 4px solid rgba(30, 30, 46, 0.95);
    }
  </style>
</head>
<body>
  <!-- 精灵球体：包含形态容器 + 状态点 + 未读徽章 -->
  <!-- FD-06 title 属性提供原生 tooltip，作为拖动提示的基础层 -->
  <div id="sphere" title="拖动移动位置 · 单击展开对话">
    <div id="sphere-form">
      <!-- 阶段二：emoji 占位；阶段三：替换为 <img src="生成的形态图片"> -->
      <span id="sphere-emoji">🧚</span>
      <img id="sphere-image" alt="" />
    </div>
    <!-- 状态指示点（idle/active/sleeping） -->
    <div id="status-dot"></div>
    <!-- 未读计数徽章 -->
    <div id="badge">0</div>
    <!-- FD-06 拖动引导提示（首次使用时显示） -->
    <div id="drag-hint">💡 拖动移动 · 单击展开</div>
  </div>

  <script type="module" src="float.js"></script>
</body>
</html>
