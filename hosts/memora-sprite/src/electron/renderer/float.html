<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSP：允许内联脚本与样式（浮动窗口为独立小窗口，无外部资源） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Memora 精灵</title>
  <style>
    /* ===== 全局重置 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-app-region: no-drag;  /* 拖动由鼠标事件手动处理，避免吞掉单击 */
    }

    /* ===== 浮动窗口主体（80x80 透明背景） ===== */
    body {
      width: 80px;
      height: 80px;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    /* ===== 精灵球体（蓝粉渐变 + 阴影 + 过渡） ===== */
    #sphere {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      /* 蓝粉渐变：对齐 docs/memora-sprite-preview.html 的 .float-icon-demo */
      background: linear-gradient(135deg, #89b4fa 0%, #f5c2e7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      box-shadow: 0 8px 24px rgba(137, 180, 250, 0.4);
    }

    /* 悬停：轻微放大 */
    #sphere:hover {
      transform: scale(1.08);
    }

    /* 拖动中：缩小 + 半透明 */
    #sphere.dragging {
      transform: scale(0.95);
      opacity: 0.8;
    }

    /* 主动提示弹跳动画（对齐 HTML 预览 @keyframes floatBounce） */
    #sphere.bounce {
      animation: floatBounce 0.6s ease;
    }
    @keyframes floatBounce {
      0%, 100% { transform: translateY(0); }
      30% { transform: translateY(-12px); }
      60% { transform: translateY(-4px); }
    }

    /* ===== 状态指示点（右下角，对齐 HTML 预览 .float-status-dot） ===== */
    #status-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #1e1e2e;  /* 与背景同色，形成镂空效果 */
      background: #a6e3a1;  /* 默认 idle 绿色 */
    }

    /* active 状态：蓝色 + 脉冲动画 */
    #status-dot.active {
      background: #89b4fa;
      animation: dotPulse 1.5s infinite;
    }
    @keyframes dotPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(137, 180, 250, 0.6); }
      50% { box-shadow: 0 0 0 6px rgba(137, 180, 250, 0); }
    }

    /* sleeping 状态：黄色月牙 */
    #status-dot.sleeping {
      background: #f9e2af;
    }

    /* ===== 未读计数徽章（右上角，对齐 HTML 预览 .float-unread-badge） ===== */
    #badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      background: #f38ba8;
      color: #1e1e2e;
      font-size: 0.7rem;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      border: 2px solid #1e1e2e;
    }

    #badge.visible {
      display: flex;
    }

    /* ===== 阶段三形态进化预留：图片加载容器 ===== */
    #sphere-form {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #sphere-form img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;  /* 阶段二不显示图片，仅预留接口 */
    }

    /* ===== FD-06 拖动引导提示（首次使用） ===== */
    /* 新用户不知道浮动窗口可以拖动，首次悬停时显示引导提示 */
    #drag-hint {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 46, 0.95);
      color: #cdd6f4;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    #drag-hint.visible {
      opacity: 1;
    }

    /* 引导提示小箭头（指向球体） */
    #drag-hint::before {
      content: '';
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 4px solid rgba(30, 30, 46, 0.95);
    }
  </style>
</head>
<body>
  <!-- 精灵球体：包含形态容器 + 状态点 + 未读徽章 -->
  <!-- FD-06 title 属性提供原生 tooltip，作为拖动提示的基础层 -->
  <div id="sphere" title="拖动移动位置 · 单击展开对话">
    <div id="sphere-form">
      <!-- 阶段二：emoji 占位；阶段三：替换为 <img src="生成的形态图片"> -->
      <span id="sphere-emoji">🧚</span>
      <img id="sphere-image" alt="" />
    </div>
    <!-- 状态指示点（idle/active/sleeping） -->
    <div id="status-dot"></div>
    <!-- 未读计数徽章 -->
    <div id="badge">0</div>
    <!-- FD-06 拖动引导提示（首次使用时显示） -->
    <div id="drag-hint">💡 拖动移动 · 单击展开</div>
  </div>

  <script>
    'use strict';

    // ─── DOM 引用 ─────────────────────────────────────────
    const sphere = document.getElementById('sphere');
    const sphereEmoji = document.getElementById('sphere-emoji');
    const sphereImage = document.getElementById('sphere-image');
    const statusDot = document.getElementById('status-dot');
    const badge = document.getElementById('badge');
    const dragHint = document.getElementById('drag-hint');

    // ─── FD-06 首次使用拖动引导 ───────────────────────────
    // 新用户不知道浮动窗口可以拖动，首次悬停时显示引导提示。
    // 使用 localStorage 标记是否已引导过，避免重复打扰老用户。
    // 引导提示在首次拖动或单击后自动消失，不再显示。
    const DRAG_HINT_SEEN_KEY = 'memora-drag-hint-seen';
    let hasShownDragHint = localStorage.getItem(DRAG_HINT_SEEN_KEY) === '1';
    let dragHintTimer = null;

    /** 显示拖动引导提示（仅首次使用时） */
    function showDragHintIfFirstTime() {
      if (hasShownDragHint) return;
      dragHint.classList.add('visible');
      // 5 秒后自动隐藏（避免长时间遮挡）
      dragHintTimer = setTimeout(() => {
        dragHint.classList.remove('visible');
      }, 5000);
    }

    /** 标记已见过引导提示（首次拖动或单击后调用） */
    function markDragHintSeen() {
      if (!hasShownDragHint) {
        hasShownDragHint = true;
        localStorage.setItem(DRAG_HINT_SEEN_KEY, '1');
        dragHint.classList.remove('visible');
        if (dragHintTimer) {
          clearTimeout(dragHintTimer);
          dragHintTimer = null;
        }
      }
    }

    // 鼠标进入球体时显示引导（仅首次）
    sphere.addEventListener('mouseenter', showDragHintIfFirstTime);
    sphere.addEventListener('mouseleave', () => {
      if (dragHintTimer) {
        clearTimeout(dragHintTimer);
        dragHintTimer = null;
      }
      dragHint.classList.remove('visible');
    });

    // ─── 拖动检测（方案 §5.4 排雷修正） ──────────────────────
    // 使用鼠标事件手动处理拖动，避免 -webkit-app-region: drag 吞掉单击事件
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let lastScreenX = 0;
    let lastScreenY = 0;

    document.addEventListener('mousedown', (e) => {
      isDragging = false;
      startX = e.screenX;
      startY = e.screenY;
      lastScreenX = e.screenX;
      lastScreenY = e.screenY;
    });

    document.addEventListener('mousemove', (e) => {
      if (e.buttons !== 1) return;  // 只处理左键按下
      const dx = e.screenX - startX;
      const dy = e.screenY - startY;

      // 阈值判断：移动超过 3px 才认为是拖动（避免单击误判）
      if (!isDragging && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) {
        isDragging = true;
        sphere.classList.add('dragging');
        // FD-06 首次拖动后标记已见过引导，不再显示
        markDragHintSeen();
        // 通知主进程开始拖动（主进程标记 isDragging 状态）
        window.electronAPI.moveFloatWindow(0, 0);
      }

      if (isDragging) {
        // 计算增量并移动窗口
        const moveDx = e.screenX - lastScreenX;
        const moveDy = e.screenY - lastScreenY;
        if (moveDx !== 0 || moveDy !== 0) {
          window.electronAPI.moveFloatWindow(moveDx, moveDy);
        }
        lastScreenX = e.screenX;
        lastScreenY = e.screenY;
      }
    });

    document.addEventListener('mouseup', () => {
      if (isDragging) {
        // 拖动结束，保存位置
        sphere.classList.remove('dragging');
        window.electronAPI.saveFloatPosition();
      } else {
        // 非拖动 → 单击 → 展开为完整窗口
        // FD-06 首次单击后标记已见过引导，不再显示
        markDragHintSeen();
        window.electronAPI.expandToFull();
      }
      isDragging = false;
    });

    // ─── 右键菜单（方案 §5.4） ────────────────────────────
    // 阻止默认右键菜单，通知主进程弹出原生 Menu
    // 菜单项：展开窗口 / 静默模式 / 隐藏到托盘 / 退出
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      window.electronAPI.showFloatContextMenu();
    });

    // ─── 未读计数监听 ──────────────────────────────────────
    window.electronAPI.onFloatUnread((count) => {
      if (count > 0) {
        badge.textContent = count > 99 ? '99+' : String(count);
        badge.classList.add('visible');
      } else {
        badge.classList.remove('visible');
      }
    });

    // ─── 精灵事件监听（统一注册，避免重复触发） ────────────
    // 注意：onSpriteEvent 在同一通道上多次注册会导致同一事件触发多次。
    // 此处合并主动提示弹跳 + 阶段三形态进化预留为一个监听器，按 type 分发。
    window.electronAPI.onSpriteEvent((event) => {
      // 主动提示：球体弹跳动画 + 状态点切换
      if (event.type === 'proactivePrompt') {
        sphere.classList.add('bounce');
        setTimeout(() => sphere.classList.remove('bounce'), 600);

        statusDot.classList.add('active');
        // 3 秒后恢复 idle
        setTimeout(() => statusDot.classList.remove('active'), 3000);
      }

      // 阶段三形态进化预留：加载生成的形态图片
      // 阶段二不触发此分支，仅预留接口
      if (event.type === 'formUpdate' && event.payload?.imageUrl) {
        sphereImage.src = event.payload.imageUrl;
        sphereImage.style.display = 'block';
        sphereEmoji.style.display = 'none';
      }
    });
  </script>
</body>
</html>
