<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSP：与 float.html 一致，script-src 限制为 self，主题由主进程注入 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>快速输入</title>
  <!--
    主题初始化由主进程 executeJavaScript 注入（injectThemeScript），
    不使用内联脚本（CSP 限制 + sandbox 兼容）。
  -->
  <style>
    /* ===== 主题变量（从 base.css 提取快速输入浮窗所需的最小集） ===== */
    /* [SYNC-BASE-CSS]
     *
     * 同步维护提醒：
     * 快速输入浮窗是独立小窗口，无法引用外部 CSS 文件，必须内联变量。
     * 修改 base.css 变量时，必须同步更新此处和 float.html！
     */
    :root {
      /* 背景与表面色 */
      --bg: #f0f0f2;
      --surface0: #ececee;
      --surface2: #dbdbdd;
      --window-bg: #ffffff;
      --muted: #6a6a72;

      /* 文字色 */
      --text: #1d1d1f;
      --subtext: #4a4a52;

      /* 语义色 */
      --accent: #0066ff;
      --accent-fg: #ffffff;
      --accent-10: rgba(0, 102, 255, 0.06);
      --accent-20: rgba(0, 102, 255, 0.1);

      /* 边框 */
      --border: #d8d8dc;

      /* 阴影 */
      --shadow-float: 0 4px 16px rgba(0, 0, 0, 0.08);
      --shadow-window: 0 8px 32px rgba(0, 0, 0, 0.12);

      /* 圆角 */
      --radius-sm: 6px;
      --radius-md: 10px;

      /* 间距 */
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;

      /* 字号 */
      --font-sm: 13px;
      --font-base: 14px;
      --font-xs: 11px;

      /* 字重 */
      --weight-medium: 500;
      --weight-semibold: 600;

      /* 动画 */
      --transition-fast: 0.12s;

      /* 字体 */
      --font-sprite: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #1e1e2e;
      --surface0: #313244;
      --surface2: #585b70;
      --window-bg: #313244;
      --muted: #b5bcd6;

      --text: #cdd6f4;
      --subtext: #a6adc8;

      --accent: #89b4fa;
      --accent-fg: #1e1e2e;
      --accent-10: rgba(137, 180, 250, 0.08);
      --accent-20: rgba(137, 180, 250, 0.2);

      --border: #45475a;

      --shadow-float: 0 4px 16px rgba(0, 0, 0, 0.4);
      --shadow-window: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    /* ===== 全局重置 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: var(--font-sprite);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-2);
    }

    /* ===== 浮窗容器 ===== */
    .quick-input-container {
      width: 100%;
      height: 100%;
      background: var(--window-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-window);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0 var(--space-3);
      /* 防止用户选中文本（输入框除外） */
      user-select: none;
      -webkit-app-region: no-drag;
    }

    /* ===== 输入框 ===== */
    .quick-input-field {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: var(--font-base);
      font-family: var(--font-sprite);
      color: var(--text);
      padding: var(--space-2) 0;
      user-select: text;
    }

    .quick-input-field::placeholder {
      color: var(--muted);
    }

    /* ===== 确认按钮 ===== */
    .quick-input-confirm {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: var(--radius-sm);
      padding: var(--space-2) var(--space-3);
      font-size: var(--font-sm);
      font-weight: var(--weight-semibold);
      font-family: var(--font-sprite);
      cursor: pointer;
      transition: opacity var(--transition-fast);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .quick-input-confirm:hover {
      opacity: 0.9;
    }

    .quick-input-confirm:active {
      opacity: 0.7;
    }

    .quick-input-confirm:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ===== 提示文字 ===== */
    .quick-input-hint {
      font-size: var(--font-xs);
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <!-- 快速输入浮窗容器：输入框 + 确认按钮 + 快捷键提示 -->
  <div class="quick-input-container">
    <input
      type="text"
      id="quick-input-field"
      class="quick-input-field"
      placeholder="输入文本，Enter 复制到剪贴板..."
      autocomplete="off"
      spellcheck="false"
      autofocus
    />
    <button id="quick-input-confirm" class="quick-input-confirm" title="复制到剪贴板（Enter）">
      复制
    </button>
    <span class="quick-input-hint">Esc 关闭</span>
  </div>

  <!-- 渲染逻辑脚本（ESM 模块，与 float.js 加载方式一致） -->
  <script type="module" src="quickInput.js"></script>
</body>
</html>
