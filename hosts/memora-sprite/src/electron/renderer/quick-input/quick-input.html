<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSP：与 float.html 一致。样式（设计令牌 + 组件样式）均经外部 stylesheet 引入，
       style-src 收紧为 'self'（去掉 'unsafe-inline'）。主题由主进程注入。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <title>快速输入</title>
  <!--
    主题初始化由主进程 executeJavaScript 注入（injectThemeScript），
    不使用内联脚本（CSP 限制 + sandbox 兼容）。
    设计令牌集中在 styles/foundation/tokens.css（单一真理源），本窗口不再内联任何变量。
  -->
  <!-- 设计令牌（单一真理源，与主窗口完全一致） -->
  <link rel="stylesheet" href="../styles/foundation/tokens.css" />
  <!-- 全局重置 + .hidden + .icon + 滚动条等通用基类（与主窗口分层一致） -->
  <link rel="stylesheet" href="../styles/foundation/base.css" />
  <!-- 原子布局工具类（flex-center / flex-col 等） -->
  <link rel="stylesheet" href="../styles/foundation/utilities.css" />
  <!-- 快速输入浮窗组件专属样式 -->
  <link rel="stylesheet" href="../styles/windows/quick-input.css" />
</head>
<body>
  <!-- SVG sprite：浮窗独立窗口，不共享主窗口 sprite，需内联定义。
       使用 class="svg-sprite"（base.css 已定义 .svg-sprite{display:none}）而非内联 style，
       避免违反 CSP style-src 'self'（与主窗口 index.html 一致）。 -->
  <svg xmlns="http://www.w3.org/2000/svg" class="svg-sprite" aria-hidden="true">
    <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 11V7a4 4 0 018 0v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="16" r="1.5" fill="currentColor"/></symbol>
    <symbol id="icon-unlock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 11V7a4 4 0 017-2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <!-- 展开按钮图标（chevron-down）：紧凑态指向下（可展开），展开态 CSS 旋转 180° 指向上（可收起） -->
    <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <!-- 润色按钮图标（sparkle/stars）：LLM 润色文本 -->
    <symbol id="icon-sparkle" viewBox="0 0 24 24"><path d="M12 2l1.5 5.5L19 9l-5.5 1.5L12 16l-1.5-5.5L5 9l5.5-1.5L12 2z" fill="currentColor"/><path d="M7 14l.5 2L9 16.5l-1.5.5L7 19l-.5-2L5 16.5l1.5-.5L7 14z" fill="currentColor"/><path d="M17 18l.5 2L19 20.5l-1.5.5L17 23l-.5-2L15 20.5l1.5-.5L17 18z" fill="currentColor"/></symbol>
    <!-- 关闭按钮图标（close/x）：pinned 模式下显式关闭浮窗 -->
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </svg>

  <!-- 快速输入浮窗容器：顶部聚焦栏 + 文本输入区 + 快捷键提示 + 补全候选列表 -->
  <div class="quick-input-container">
    <!-- 顶部聚焦提示栏：显示当前聚焦应用名（无聚焦时禁用 Tab），右侧关闭按钮 -->
    <!-- 初始 .no-focus 类与"无聚焦"文案匹配，show() 时 notifyFocusChange 移除该类并更新文案 -->
    <div id="focus-bar" class="focus-bar no-focus">
      <span id="focus-app-name" class="focus-app-name">无聚焦</span>
      <button id="close-btn" type="button" class="close-btn" aria-label="关闭浮窗" title="关闭浮窗（Esc）"><svg class="icon"><use href="#icon-close"/></svg></button>
    </div>

    <!-- 输入区：textarea（支持多行长文本 + 自动高度） -->
    <div class="quick-input-area flex-shrink-0">
      <textarea
        id="quick-input-field"
        class="quick-input-field"
        placeholder="输入文本…"
        autocomplete="off"
        spellcheck="false"
        autofocus
        rows="1"
        aria-label="快速输入文本"
        role="combobox"
        aria-autocomplete="list"
        aria-controls="completion-list"
        aria-expanded="false"
        aria-activedescendant=""
      ></textarea>
      <!-- footer 区域同时承担拖动浮窗的把手（cursor: move 视觉提示） -->
      <div id="quick-input-footer" class="quick-input-footer flex-between flex-shrink-0">
        <span class="quick-input-hint flex-shrink-0">↓↑ 补全 · ←→ 填充 · Tab 提交 · Esc 关闭</span>
        <button id="polish-toggle" type="button" class="polish-toggle" aria-label="LLM 润色文本" title="LLM 润色文本（语法修正 + 表达优化）"><svg class="icon"><use href="#icon-sparkle"/></svg></button>
        <button id="expand-toggle" type="button" class="expand-toggle" aria-label="展开输入框" title="展开输入框（点击切换高度）"><svg class="icon"><use href="#icon-chevron-down"/></svg></button>
        <button id="pinned-toggle" type="button" class="pinned-toggle" aria-label="常驻模式切换" title="常驻模式关闭：失焦后关闭窗口（点击切换）"><svg class="icon"><use href="#icon-unlock"/></svg></button>
        <span class="quick-input-counter flex-shrink-0">0 字</span>
      </div>
    </div>
    <!-- 补全候选列表（输入 ≥2 字符后显示，↑↓ 导航 + ←→ 填充） -->
    <ul id="completion-list" class="completion-list hidden" role="listbox" aria-label="补全候选"></ul>
  </div>

  <!-- 渲染逻辑脚本（ESM 模块，与 float.js 加载方式一致） -->
  <script type="module" src="quickInput.js"></script>
</body>
</html>
