<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSP：与 float.html 一致。样式（设计令牌 + 组件样式）均经外部 stylesheet 引入，
       style-src 收紧为 'self'（去掉 'unsafe-inline'）。主题由主进程注入。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <title>快速输入</title>
  <!--
    主题初始化由主进程 executeJavaScript 注入（injectThemeScript），
    不使用内联脚本（CSP 限制 + sandbox 兼容）。
    设计令牌集中在 styles/tokens.css（单一真理源），本窗口不再内联任何变量。
  -->
  <!-- 设计令牌（单一真理源，与主窗口完全一致） -->
  <link rel="stylesheet" href="../styles/tokens.css" />
  <!-- 快速输入浮窗组件专属样式 -->
  <link rel="stylesheet" href="quick-input.css" />
</head>
<body>
  <!-- 快速输入浮窗容器：文本输入区 + 快捷键提示 + 补全候选列表 -->
  <div class="quick-input-container">
    <!-- 输入区：textarea（支持多行长文本 + 自动高度） -->
    <div class="quick-input-area">
      <textarea
        id="quick-input-field"
        class="quick-input-field"
        placeholder="输入文本，↓↑ 选择补全，←→ 填充，Tab 确认..."
        autocomplete="off"
        spellcheck="false"
        autofocus
        rows="1"
      ></textarea>
      <div class="quick-input-footer">
        <span class="quick-input-hint">Tab 确认 · Esc 关闭</span>
        <span class="quick-input-counter">0 字</span>
      </div>
    </div>
    <!-- 补全候选列表（输入 ≥2 字符后显示，↑↓ 导航 + ←→ 填充） -->
    <ul id="completion-list" class="completion-list hidden" role="listbox" aria-label="补全候选"></ul>
  </div>

  <!-- 渲染逻辑脚本（ESM 模块，与 float.js 加载方式一致） -->
  <script type="module" src="quickInput.js"></script>
</body>
</html>
