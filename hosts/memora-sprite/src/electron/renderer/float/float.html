<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSP：浮动窗口为独立小窗口，style-src 保留 'unsafe-inline'（内联 CSS 变量定义） -->
  <!-- script-src 限制为 self，主题初始化由主进程 executeJavaScript 注入 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Memora 精灵</title>
  <!--
    主题初始化已从内联脚本迁移至主进程 executeJavaScript 注入：
    详见 floatWindow.ts 中的 did-start-loading 事件处理。
  -->
  <style>
    /* ===== 主题变量（从 base.css 提取浮动窗口所需的最小集） ===== */
    /* 同步 base.css 的变量值，确保两个窗口主题一致
     * 补齐缺失的语义色变量（--red/--pink 等），与 base.css 保持 1:1 对齐
     *
     * ⚠️ 同步维护提醒：
     * 修改 base.css 变量时，必须同步更新此处！
     * 搜索标记 [SYNC-BASE-CSS] 可快速定位所有需要同步的变量块
     */
    :root {
      /* 背景与表面色 */
      --bg: #f0f0f2;
      --surface0: #ececee;
      --surface2: #dbdbdd;
      --window-bg: #ffffff;
      --window-bg-2: #efeff1;
      --muted: #a1a1a6;

      /* 品牌渐变：与 base.css 一致（球体背景 + 头像等） */
      --brand-grad: linear-gradient(135deg, #89b4fa 0%, #f5c2e7 100%);

      /* 文字色 */
      --text: #1d1d1f;

      /* 语义色（与 base.css 完全对齐） */
      --green: #34c759;
      --accent: #0066ff;
      --accent-20: rgba(0, 102, 255, 0.1);
      --yellow: #ff9f0a;
      --red: #ff3b30;       /* badge 背景色 */
      --pink: #ad1457;       /* 与 base.css 浅色主题一致 */

      /* 引导提示 */
      --hint-bg: rgba(30, 30, 46, 0.95);
      --hint-text: #cdd6f4;

      /* 徽章 */
      --badge-text: #1e1e2e;
      --badge-border: #1e1e2e;

      /* 阴影 */
      --shadow-float: 0 4px 16px rgba(0, 0, 0, 0.06);

      /* 圆角 */
      --radius-xs: 3px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-pill: 100px;

      /* 动画 */
      --transition-fast: 0.12s;
      --transition-base: 0.2s;
      --transition-slow: 0.3s;
    }

    [data-theme="dark"] {
      /* 背景与表面色 */
      --bg: #1e1e2e;
      --surface0: #313244;
      --surface2: #585b70;
      --window-bg: #313244;
      --window-bg-2: #45475a;
      --muted: #9399b2;

      /* 品牌渐变：与浅色一致（两主题共享） */
      --brand-grad: linear-gradient(135deg, #89b4fa 0%, #f5c2e7 100%);

      /* 文字色 */
      --text: #cdd6f4;

      /* 语义色（与 base.css 完全对齐） */
      --green: #a6e3a1;
      --accent: #89b4fa;
      --accent-20: rgba(137, 180, 250, 0.2);
      --yellow: #f9e2af;
      --red: #f38ba8;        /* 深色主题红色 */
      --pink: #f5c2e7;       /* 深色主题粉色 */

      /* 引导提示 */
      --hint-bg: rgba(205, 214, 244, 0.95);
      --hint-text: #1e1e2e;

      /* 徽章 */
      --badge-text: #1e1e2e;
      --badge-border: #cdd6f4;

      /* 阴影 */
      --shadow-float: 0 4px 16px rgba(0, 0, 0, 0.4);

      /* 圆角（与浅色一致） */
      --radius-xs: 3px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-pill: 100px;

      /* 动画（与浅色一致） */
      --transition-fast: 0.12s;
      --transition-base: 0.2s;
      --transition-slow: 0.3s;
    }

    /* ===== 全局重置 ===== */
    html, body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-app-region: no-drag;  /* 拖动由鼠标事件手动处理，避免吞掉单击 */
      width: 80px;
      height: 80px;
      background: transparent;
      /* 浮动窗口禁止滚动条：badge 和 drag-hint 通过 overflow:visible 溢出显示，
         但 html 层必须隐藏溢出，否则会出现丑陋的滚动条 */
      overflow: hidden;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-app-region: no-drag;
    }

    /* ===== 浮动窗口主体（80x80 透明背景） ===== */
    body {
      /* body 层允许 badge 和 drag-hint 超出版心显示
         （html 层已 overflow:hidden，不会产生滚动条） */
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    /* ===== 精灵球体（蓝粉渐变 + 阴影 + 过渡） ===== */
    #sphere {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      /* 蓝粉渐变：对齐 的 .float-icon-demo */
      background: var(--brand-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      position: relative;
      transition: transform var(--transition-base) ease, box-shadow var(--transition-slow) ease;
      /* 使用主题感知阴影变量，与 base.css 设计系统保持一致 */
      box-shadow: var(--shadow-float);
    }

    /* 悬停：轻微放大 */
    #sphere:hover {
      transform: scale(1.08);
    }

    /* 拖动中：缩小 + 半透明 */
    #sphere.dragging {
      transform: scale(0.95);
      opacity: 0.8;
    }

    /* 缺口 1.2：用户离开态——球体变暗 + 灰度滤镜，表达"精灵等待中" */
    /* 视觉与 dragging 区分：dragging 是用户主动操作（保留鲜明），away 是被动等待（柔化） */
    #sphere.away {
      opacity: 0.5;
      filter: grayscale(0.6);
    }

    /* 主动提示弹跳动画（对齐 HTML 预览 @keyframes floatBounce） */
    /* UI-AE-02 弱化弹跳幅度：12px→6px，与专注模式基调一致 */
    #sphere.bounce {
      animation: floatBounce 0.5s ease;
    }
    @keyframes floatBounce {
      0%, 100% { transform: translateY(0); }
      40%  { transform: translateY(-6px); }
      70%  { transform: translateY(-2px); }
    }

    /* ===== 状态指示点（右下角，对齐 HTML 预览 .float-status-dot） ===== */
    #status-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--bg);  /* 与背景同色，形成镂空效果 */
      background: var(--green);  /* 默认 idle 绿色 */
    }

    /* active 状态：蓝色 + 脉冲动画 */
    #status-dot.active {
      background: var(--accent);
      /* 脉冲动画改用伪元素 + transform 实现：
       * - box-shadow 动画会触发每帧重绘，性能差
       * - ::before 伪元素 + transform:scale + opacity 可 GPU 加速，性能更优
       * - 视觉效果与原方案一致：向外扩散的半透明圆环
       */
      position: relative;
    }
    #status-dot.active::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--accent);
      transform: translate(-50%, -50%) scale(1);
      opacity: 0.4;
      animation: dotPulse 1.5s infinite ease-out;
      pointer-events: none;
    }
    @keyframes dotPulse {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.4;
      }
      100% {
        transform: translate(-50%, -50%) scale(3);
        opacity: 0;
      }
    }

    /* sleeping 状态：黄色月牙 */
    #status-dot.sleeping {
      background: var(--yellow);
    }

    /* 缺口 1.2：away 状态——用户离开时状态点变黄（与 sleeping 视觉一致但语义独立） */
    /* sleeping 是精灵主动休眠（夜间），away 是用户被动离开（白天） */
    #status-dot.away {
      background: var(--yellow);
    }

    /* UI-AE-02 prefers-reduced-motion：尊重用户系统偏好 */
    @media (prefers-reduced-motion: reduce) {
      #sphere.bounce {
        animation: none;
      }
      #status-dot.active {
        animation: none;
      }
    }

    /* ===== 未读计数徽章（右上角，对齐 HTML 预览 .float-unread-badge） ===== */
    #badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      background: var(--red);
      color: var(--badge-text);
      font-size: 0.7rem;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      border: 2px solid var(--badge-border);
    }

    #badge.visible {
      display: flex;
    }

    /* ===== 阶段三形态进化预留：图片加载容器 ===== */
    #sphere-form {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #sphere-form img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;  /* 阶段二不显示图片，仅预留接口 */
    }

    /* ===== 拖动引导提示（首次使用） ===== */
    /* 新用户不知道浮动窗口可以拖动，首次悬停时显示引导提示 */
    #drag-hint {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--hint-bg);
      color: var(--hint-text);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    #drag-hint.visible {
      opacity: 1;
    }

    /* 引导提示小箭头（指向球体） */
    #drag-hint::before {
      content: '';
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 4px solid var(--hint-bg);
    }

    /* 缺口 1.2：离开时长小标签（用户离开超过 5 分钟时显示） */
    /* 复用 #drag-hint 的视觉风格（hint-bg 半透明黑底 + hint-text 浅色文字） */
    /* 位置在球体上方（与 drag-hint 底部位置区分，避免同时显示时重叠） */
    #away-label {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--hint-bg);
      color: var(--hint-text);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    #away-label.visible {
      opacity: 1;
    }

    /* 离开时长小标签小箭头（指向球体，向下） */
    #away-label::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 4px solid var(--hint-bg);
    }

    /* ─── P4-1：消息预览卡片 ─────────────────────────── */
    /* 悬停球体时在右侧显示最后一条助手消息预览 */
    #message-preview {
      position: absolute;
      left: 88px;   /* 球体右侧 8px 间隙 */
      top: 50%;
      transform: translateY(-50%);
      width: 200px;
      max-height: 120px;
      background: var(--window-bg);
      border: 1px solid var(--surface2);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-float);
      padding: 10px 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-slow);
      z-index: 20;
      overflow: hidden;
    }

    #message-preview.visible {
      opacity: 1;
    }

    .message-preview-header {
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .message-preview-text {
      font-size: 12px;
      line-height: 1.5;
      color: var(--text);
      /* 最多显示 4 行，超出省略 */
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- 精灵球体：包含形态容器 + 状态点 + 未读徽章 -->
  <!-- title 属性提供原生 tooltip，作为拖动提示的基础层 -->
  <div id="sphere" role="button" tabindex="0" aria-label="Memora 精灵，单击展开对话，拖动移动位置" title="拖动移动位置 · 单击展开对话">
    <div id="sphere-form">
      <!-- 阶段二：emoji 占位；阶段三：替换为 <img src="生成的形态图片"> -->
      <span id="sphere-emoji">🧚</span>
      <!-- 图片在视口外时延迟加载 -->
      <img id="sphere-image" alt="" width="72" height="72" loading="lazy" />
    </div>
    <!-- 状态指示点（idle/active/sleeping） -->
    <div id="status-dot" aria-hidden="true"></div>
    <!-- 未读计数徽章 -->
    <div id="badge" aria-label="未读消息计数">0</div>
    <!-- 拖动引导提示（首次使用时显示） -->
    <div id="drag-hint" role="status">💡 拖动移动 · 单击展开</div>
    <!-- 缺口 1.2：离开时长小标签（用户离开超过 5 分钟时显示） -->
    <div id="away-label" role="status"></div>
    <!-- P4-1：消息预览卡片（悬停球体时显示最后一条助手消息） -->
    <div id="message-preview" role="tooltip" aria-label="最后一条助手消息预览">
      <div class="message-preview-header">最新回复</div>
      <div class="message-preview-text"></div>
    </div>
  </div>

  <script type="module" src="float.js"></script>
</body>
</html>
