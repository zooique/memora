<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSP：浮动窗口样式（设计令牌 + 组件样式）均经外部 stylesheet 引入，
       style-src 收紧为 'self'（去掉 'unsafe-inline'），杜绝内联样式注入风险。
       script-src 限制为 self，主题初始化由主进程 executeJavaScript 注入。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <title>Memora 精灵</title>
  <!--
    主题初始化已从内联脚本移至主进程 executeJavaScript 注入：
    详见 floatWindow.ts 中的 did-start-loading 事件处理。
    设计令牌集中在 styles/foundation/tokens.css（单一真理源），本窗口不再内联任何变量，
    避免与主窗口令牌漂移。
  -->
  <!-- 浮窗加载顺序（§2.4.9）：foundation 三层（tokens + base + utilities） → windows/float.css -->
  <!-- 设计令牌（单一真理源，与主窗口完全一致） -->
  <link rel="stylesheet" href="../styles/foundation/tokens.css" />
  <!-- 全局重置 + .hidden + .icon + 滚动条等通用基类 -->
  <link rel="stylesheet" href="../styles/foundation/base.css" />
  <!-- 原子布局工具类（flex-center / surface-card / text-muted 等） -->
  <link rel="stylesheet" href="../styles/foundation/utilities.css" />
  <!-- 浮动窗口组件专属样式 -->
  <link rel="stylesheet" href="../styles/windows/float.css" />
</head>
<body>
  <!-- 精灵球体：包含形态容器 + 状态点 + 未读徽章 -->
  <!-- title 属性提供原生 tooltip，作为拖动提示的基础层 -->
  <div id="sphere" role="button" tabindex="0" aria-label="Memora 精灵，单击展开对话，拖动移动位置" title="拖动移动位置 · 单击展开对话">
    <div id="sphere-form">
      <!--
        默认形态：项目 logo（assets/icon.svg 真理源）。
        第一版本对齐项目 logo 设计，替代原 emoji 占位。
        未来形态进化：主进程通过 SPRITE_EVENT/formUpdate 事件推送新 imageUrl，
        float.ts 监听后覆盖 src 即可切换精灵形态（保留为扩展点，不破坏当前默认）。
        draggable="false" 防止浏览器原生 HTML5 图片拖拽（拖出 ghost 图片干扰球体拖动）。
        相对路径：float.html → dist-electron/electron/renderer/float/，往上级 3 层到 dist-electron/，再到 assets/icon.svg。

        尺寸真理源：CSS（float.css 中 #sphere-form img 引用 --float-sphere-logo 令牌）。
        HTML 不设置 width/height 属性——浮窗父容器（#sphere-form）尺寸固定，无 CLS 风险，
        消除 HTML 表现属性与 CSS 双写漂移。
      -->
      <img id="sphere-image" src="../../../assets/icon.svg" alt="Memora 精灵" draggable="false" />
    </div>
    <!-- 状态指示点（idle/active/sleeping） -->
    <div id="status-dot" aria-hidden="true"></div>
    <!-- 未读计数徽章：title 提供 hover tooltip，明确徽章含义（AI 回复未读计数） -->
    <div id="badge" aria-label="未读消息计数" title="AI 回复未读：点击球体展开查看">0</div>
    <!-- 拖动引导提示（首次使用时显示） -->
    <div id="drag-hint" role="status">💡 拖动移动 · 单击展开</div>
    <!-- 离开时长小标签（用户离开超过 5 分钟时显示） -->
    <div id="away-label" role="status"></div>
    <!-- P4-1：消息预览卡片（悬停球体时显示最后一条助手消息） -->
    <div id="message-preview" role="tooltip" aria-label="最后一条助手消息预览">
      <div class="message-preview-header">最新回复</div>
      <div class="message-preview-text"></div>
    </div>
  </div>

  <script type="module" src="float.js"></script>
</body>
</html>
