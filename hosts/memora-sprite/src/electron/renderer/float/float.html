<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSP：浮动窗口样式（设计令牌 + 组件样式）均经外部 stylesheet 引入，
       style-src 收紧为 'self'（去掉 'unsafe-inline'），杜绝内联样式注入风险。
       script-src 限制为 self，主题初始化由主进程 executeJavaScript 注入。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <title>Memora 精灵</title>
  <!--
    主题初始化已从内联脚本移至主进程 executeJavaScript 注入：
    详见 floatWindow.ts 中的 did-start-loading 事件处理。
    设计令牌集中在 styles/foundation/tokens.css（单一真理源），本窗口不再内联任何变量，
    避免与主窗口令牌漂移。
  -->
  <!-- 设计令牌（单一真理源，与主窗口完全一致） -->
  <link rel="stylesheet" href="../styles/foundation/tokens.css" />
  <!-- 浮动窗口组件专属样式 -->
  <link rel="stylesheet" href="../styles/windows/float.css" />
</head>
<body>
  <!-- 精灵球体：包含形态容器 + 状态点 + 未读徽章 -->
  <!-- title 属性提供原生 tooltip，作为拖动提示的基础层 -->
  <div id="sphere" role="button" tabindex="0" aria-label="Memora 精灵，单击展开对话，拖动移动位置" title="拖动移动位置 · 单击展开对话">
    <div id="sphere-form">
      <!-- 阶段二：emoji 占位；阶段三：替换为 <img src="生成的形态图片"> -->
      <span id="sphere-emoji">🧚</span>
      <!-- 图片在视口外时延迟加载 -->
      <img id="sphere-image" alt="" width="72" height="72" loading="lazy" />
    </div>
    <!-- 状态指示点（idle/active/sleeping） -->
    <div id="status-dot" aria-hidden="true"></div>
    <!-- 未读计数徽章 -->
    <div id="badge" aria-label="未读消息计数">0</div>
    <!-- 拖动引导提示（首次使用时显示） -->
    <div id="drag-hint" role="status">💡 拖动移动 · 单击展开</div>
    <!-- 离开时长小标签（用户离开超过 5 分钟时显示） -->
    <div id="away-label" role="status"></div>
    <!-- P4-1：消息预览卡片（悬停球体时显示最后一条助手消息） -->
    <div id="message-preview" role="tooltip" aria-label="最后一条助手消息预览">
      <div class="message-preview-header">最新回复</div>
      <div class="message-preview-text"></div>
    </div>
  </div>

  <script type="module" src="float.js"></script>
</body>
</html>
