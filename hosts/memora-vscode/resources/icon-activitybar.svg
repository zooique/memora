<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 40" width="50" height="40">
  <!-- memora 活动栏图标 · 单色线条版（VS Code 以 CSS mask 蒙版并按主题前景色染色，颜色值不生效，仅 alpha 形状生效） -->
  <!-- 规范：24x24 图形居中于 50x40 画布（内容域 x 13..37 / y 8..32），M 骨架与 icon.png 同源等比 -->
  <!-- 结构：四条线段（两竖 + 两斜）与五珠分离——线宽 1，线段端点向内收 3.0（珠 r1.5 + 断点 1.0 + 圆头外溢 0.5），对齐原设计「珠线不相连、线头圆头」 -->
  <!-- 24px 可读性取舍：icon 的双轨+缝隙结构在小尺寸糊成一团，故用单轨 + 珠点加大（r1.5）保留「记忆节点」识别特征 -->
  <g stroke="#888888" stroke-width="1" stroke-linecap="round" fill="none">
    <path d="M16.5 15.45V24.55M33.5 15.45V24.55M18.4 14.77 23.1 20.54M31.6 14.77 27.4 20.54"/>
  </g>
  <!-- 记忆珠：五节点各一珠，与线段断开 -->
  <g fill="#888888">
    <circle cx="16.5" cy="12.45" r="1.5"/>
    <circle cx="33.5" cy="12.45" r="1.5"/>
    <circle cx="25" cy="22.86" r="1.5"/>
    <circle cx="16.5" cy="27.55" r="1.5"/>
    <circle cx="33.5" cy="27.55" r="1.5"/>
  </g>
</svg>
