<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- memora 活动栏图标 · 单色线条版（VS Code 以 CSS mask 蒙版并按主题前景色染色，颜色值不生效，仅 alpha 形状生效） -->
  <!-- 规范：画布 24x24（activity bar 图标标准网格）——旧版为 50x40 画布，被等比塞进 24px 槽位后整图仅约 11.5px、线宽 1 缩到 0.48px 亚像素发灰，故按 24 网格重绘 -->
  <!-- 内容域：x 1.8..22.2 / y 2.75..21.25，四周留 ≈2 边距，保证 16~24px 显示时不糊边 -->
  <!-- 结构：四条线段（两竖 + 两斜）与五珠分离——线宽 1.5，线段端点收在珠心外 3.0（珠 r1.7 + 断点 1.3），对齐原设计「珠线不相连、线头圆头」 -->
  <g stroke="#000000" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M3.5 7.45V16.55M20.5 7.45V16.55M5.4 6.77 10.1 12.54M18.6 6.77 14.4 12.54"/>
  </g>
  <!-- 记忆珠：五节点各一珠，与线段断开；r1.7 保证活动栏 24px / 高 DPI 缩放下仍是可辨的圆点（旧版 r1.5 在 50 网格里等效仅 0.72px） -->
  <g fill="#000000">
    <circle cx="3.5" cy="4.45" r="1.7"/>
    <circle cx="20.5" cy="4.45" r="1.7"/>
    <circle cx="12" cy="14.86" r="1.7"/>
    <circle cx="3.5" cy="19.55" r="1.7"/>
    <circle cx="20.5" cy="19.55" r="1.7"/>
  </g>
</svg>
