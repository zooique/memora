# Lefthook pre-commit 钩子配置
# 在每次 git commit 前自动执行代码质量检查
#
# 检查链（按序执行，任一步骤失败则阻止提交）：
#   1. lint-staged  —— 只检查 staged .ts 文件（快速）
#   2. typecheck     —— 全量类型检查（必须）
#
# 不在 pre-commit 运行 vitest（15s+），应在 CI 或手动 pre-push 中运行
# 详见 .trae/rules/project-rules.md §6 提交规范

pre-commit:
  parallel: false
  commands:
    # 步骤 1：ESLint 检查 staged 的 TypeScript 文件
    lint-staged:
      glob: "*.ts"
      run: npx eslint {staged_files} --max-warnings 0 --no-warn-ignored
      stage_fixed: true

    # 步骤 2：全量 TypeScript 类型检查
    typecheck:
      glob: "*.ts"
      run: npx tsc --noEmit

    # 步骤 3：CSS 守卫（stylelint；importFrom 提供 token 集，守卫全量 styles 目录）
    #   - 仅当本次提交含 *.css 时触发；npm run lint:css 跑全量目录保证守卫强度
    #   - 抓「引用不存在的 --x token」/ 重复属性 / 非法 hex / 空源（详见 .stylelintrc.mjs）
    #   - lint:css 脚本定义在 hosts/memora-sprite/package.json，故 root 锁定到该子目录，
    #     否则 lefthook 在仓库根目录执行会报 Missing script: lint:css
    lint:css:
      glob: "*.css"
      root: hosts/memora-sprite
      run: npm run lint:css
      stage_fixed: false

# 提交信息规范校验（commitlint）
# 强制执行 conventional commits 规范，详见 commitlint.config.mjs
commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

# 可选：pre-push 阶段运行测试（较慢，按需启用）
# pre-push:
#   commands:
#     test:
#       run: npx vitest run