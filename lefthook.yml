# Lefthook 钩子配置 — 门禁的**触发器**（步骤定义不在这里，见 .trae/decisions/ADR-032）
#
# 分层（2026-09-16）：
#   pre-commit → fast 档（两侧 tsc + 两侧 lint + 秒级守卫，≈50s）  —— 提交时便宜，默认路径才有人走
#   pre-push   → full 档（步骤/耗时以 local-ci 收据日志为准）—— 推送前完整体检，含宿主构建与 dist 契约
#
# 步骤清单**只**在 scripts/local-ci.mjs 定义；本文件只传 --preset，禁止在此复制步骤
# （复制即产生第二份"要跑什么"的清单 = 并列，见 single-truth-source-mindset.md）。
#
# 为何内核 tsc 不再单列：fast 档已含 kernel:typecheck（同一条 `npm run typecheck`），
# 单列即与 preset 重复；故收敛给 preset，本文件只留 preset 不含的 lint-staged 自动修复。
#
# 为何两侧 lint 也不再单列（2026-11-07 用户拍板）：kernel:lint / host:lint 已并入 fast 档；
# 此前只靠 lint-staged（staged 限定）⇒ 未 stage 的越限文件提交时看不见、推送时才被拦
# （「提交时以为干净」）。lint-staged 保留「就地修复」角色，判据归 preset。
#
# 诚实结论（不承诺强制）：本地钩子物理上不可强制（LEFTHOOK=0 / --no-verify / 删钩子都能绕）。
# 设计只保证「① 默认路径便宜 ② 绕过可被外部发现」——每次运行落盘带 tree/head 收据的日志，
# 绕过一次即无收据，发布前检查清单一行比对即可发现。详见 ADR-032。
#
# ⚠️ 拍板（2026-10-21）：**推送绕过 full（LEFTHOOK=0）是故意设计**——full 档含 LLM 相关测试，
# 每次推送都跑浪费算力；不是缺口、禁止"修复"成强制。
# 由此产生的唯一盲区 = format/rules:refs 类潜伏红只有 full 能抓（子集门禁不含）；
# 对策不是改推送，而是**把 prettier 就地修复下沉到 pre-commit**（见下方 prettier-fix），
# 让最易红的 format 项在便宜的提交层就地清零——绕过 full 也不再潜伏。
#
# 提交规范（conventional commits）见 .trae/rules/project-rules.md §6

# ⚠️ 执行顺序（2026-11-10 实验定案 · 别再靠 YAML 书写序猜）：
#   lefthook 2.1.10 实测——**未写 priority 时按命令名字母序执行**（不是书写序）；
#   写了 priority 的按数值升序**先跑**，未写的排在其后（仍按字母序）。
#   由此本文件曾按 `gate-fast → lint-staged → prettier-fix` 执行：**判据跑在就地修复之前**，
#   于是「格式化前 1000 行、格式化后 1005 行」的内容被判据放行、再由 prettier 折行后提交
#   （实证 `09621033` 把 extension.ts 推到 1005 行仍过 pre-commit）。
#   故三条命令**全部显式写 priority**：修复(1/2) 在判据(3) 之前，判据看到的就是将被提交的内容。
#   新增命令必须一并写 priority——不写就会被字母序塞到判据前后任意位置，洞会静默复发。
pre-commit:
  parallel: false
  commands:
    # 就地修复 · 格式（P0 门禁链补钩，2026-10-21）：只碰 ts/mjs/json——md 被 .prettierignore
    # 全域挡（frontmatter 改写 + CJK 表格对齐两处实证损害，勿放宽）。
    # 为何必须在提交层：此前格式修复只靠 full 档 format:check，而 full 挂 pre-push 且
    # 推送常绕（拍板的省算力设计）⇒ 格式欠账长期潜伏、只在跑 full 时才爆（本轮实锤 9 文件）。
    prettier-fix:
      priority: 1
      glob: "*.{ts,mjs,json}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

    # fast 档前的「就地修复」：只扫 staged 的 .ts 并自动修格式（全仓 lint 判据已由 preset 承担）
    lint-staged:
      priority: 2
      glob: "*.ts"
      run: npx eslint {staged_files} --max-warnings 0 --no-warn-ignored
      stage_fixed: true

    # 门禁 fast 档：两侧 tsc + 两侧 lint + 秒级守卫（落盘收据日志）
    # priority 3 = 排在两处就地修复之后（顺序理由见本文件 pre-commit 上方的执行顺序说明）
    gate-fast:
      priority: 3
      run: npm run ci:local -- --preset=fast

# 提交信息规范校验（commitlint）
# 强制执行 conventional commits 规范，详见 commitlint.config.mjs
commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

# 门禁 full 档（步骤清单以 scripts/local-ci.mjs 的 ALL_STEPS 为真源，本文件不复制数字——
# 复制即过期，见 single-truth-source-mindset.md「描述性计数 = 时点快照」）
pre-push:
  commands:
    gate-full:
      run: npm run ci:local -- --preset=full
