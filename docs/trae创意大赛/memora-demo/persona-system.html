<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memora 角色系统演示</title>
<style>
/* ===== 全局重置与 CSS 变量 ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1e1e2e;
  --surface0: #313244;
  --surface1: #45475a;
  --surface2: #585b70;
  --window-bg: #313244;
  --window-bg-2: #45475a;
  --text: #cdd6f4;
  --subtext: #a6adc8;
  --muted: #9399b2;
  --accent: #89b4fa;
  --accent-soft: rgba(137, 180, 250, 0.15);
  --green: #a6e3a1;
  --yellow: #f9e2af;
  --pink: #f5c2e7;
  --red: #f38ba8;
  --mauve: #cba6f7;
  --teal: #94e2d5;
  --peach: #fab387;
  --brand-grad: linear-gradient(135deg, #89b4fa 0%, #f5c2e7 100%);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 12px;
  --radius-pill: 100px;
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  --transition-fast: 0.12s;
  --transition-base: 0.2s;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

/* ===== 顶部导航栏 ===== */
.navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 56px;
  background: var(--surface0);
  border-bottom: 1px solid var(--surface1);
  backdrop-filter: blur(12px);
}

.navbar-brand {
  font-size: 18px;
  font-weight: 700;
  background: var(--brand-grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.navbar-link {
  color: var(--subtext);
  text-decoration: none;
  font-size: 14px;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--surface1);
  transition: all var(--transition-base);
}

.navbar-link:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-soft);
}

/* ===== 主布局：左右分栏 ===== */
.main-container {
  display: flex;
  height: calc(100vh - 56px);
  overflow: hidden;
}

/* 左侧对话区 */
.chat-panel {
  width: 55%;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--surface1);
}

/* 对话标题栏 */
.chat-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--surface1);
  background: var(--surface0);
}

.chat-header h2 {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}

.chat-header p {
  font-size: 13px;
  color: var(--muted);
  margin-top: 2px;
}

/* 消息列表 */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* 消息气泡 */
.message {
  max-width: 80%;
  padding: 12px 16px;
  border-radius: var(--radius-lg);
  font-size: 14px;
  line-height: 1.6;
  animation: msgIn 0.3s ease-out;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message-user {
  align-self: flex-end;
  background: var(--accent);
  color: var(--bg);
  border-bottom-right-radius: 4px;
}

.message-sprite {
  align-self: flex-start;
  background: var(--surface1);
  color: var(--text);
  border-bottom-left-radius: 4px;
}

.message-system {
  align-self: center;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 12px;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
}

/* 输入区域 */
.chat-input-area {
  padding: 16px 20px;
  border-top: 1px solid var(--surface1);
  background: var(--surface0);
}

/* 预设示例按钮 */
.example-buttons {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.example-btn {
  padding: 6px 14px;
  font-size: 13px;
  color: var(--subtext);
  background: var(--surface1);
  border: 1px solid var(--surface2);
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: all var(--transition-base);
  font-family: inherit;
}

.example-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-soft);
}

/* 输入框 */
.chat-input-row {
  display: flex;
  gap: 8px;
}

.chat-input {
  flex: 1;
  padding: 10px 16px;
  font-size: 14px;
  color: var(--text);
  background: var(--surface1);
  border: 1px solid var(--surface2);
  border-radius: var(--radius-md);
  outline: none;
  font-family: inherit;
  transition: border-color var(--transition-base);
}

.chat-input:focus {
  border-color: var(--accent);
}

.chat-input::placeholder {
  color: var(--muted);
}

.send-btn {
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 600;
  color: var(--bg);
  background: var(--brand-grad);
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: opacity var(--transition-base);
  font-family: inherit;
}

.send-btn:hover {
  opacity: 0.85;
}

.send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ===== 右侧角色面板 ===== */
.persona-panel {
  width: 45%;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* 当前角色卡片 */
.current-persona-card {
  background: var(--surface0);
  border: 1px solid var(--surface1);
  border-radius: var(--radius-lg);
  padding: 20px;
  position: relative;
  overflow: hidden;
}

.current-persona-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--brand-grad);
}

.current-persona-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}

.current-persona-icon {
  font-size: 32px;
}

.current-persona-info h3 {
  font-size: 18px;
  font-weight: 700;
}

.current-persona-info .mode-tag {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  margin-left: 8px;
  font-weight: 500;
}

.mode-auto {
  background: rgba(166, 227, 161, 0.15);
  color: var(--green);
}

.mode-manual {
  background: rgba(250, 179, 135, 0.15);
  color: var(--peach);
}

.current-persona-desc {
  font-size: 13px;
  color: var(--subtext);
  margin-top: 4px;
}

/* 角色列表 */
.persona-list-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.persona-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.persona-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--surface0);
  border: 1px solid var(--surface1);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition-base);
}

.persona-card:hover {
  border-color: var(--surface2);
  background: var(--surface1);
}

.persona-card.active {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 1px var(--accent);
}

.persona-card-icon {
  font-size: 24px;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface1);
  border-radius: var(--radius-sm);
  flex-shrink: 0;
}

.persona-card-info h4 {
  font-size: 14px;
  font-weight: 600;
}

.persona-card-info p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

/* 匹配分数可视化 */
.match-section {
  background: var(--surface0);
  border: 1px solid var(--surface1);
  border-radius: var(--radius-lg);
  padding: 20px;
}

.match-section h3 {
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 16px;
}

/* 分析中动画 */
.analyzing-indicator {
  display: none;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  font-size: 13px;
  color: var(--accent);
}

.analyzing-indicator.visible {
  display: flex;
}

.analyzing-dots span {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: dotPulse 1.2s infinite;
}

.analyzing-dots span:nth-child(2) { animation-delay: 0.2s; }
.analyzing-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dotPulse {
  0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1.2); }
}

/* 匹配分数条 */
.match-item {
  margin-bottom: 12px;
}

.match-item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.match-item-name {
  font-size: 13px;
  font-weight: 500;
}

.match-item-score {
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.match-bar-bg {
  width: 100%;
  height: 6px;
  background: var(--surface2);
  border-radius: 3px;
  overflow: hidden;
}

.match-bar-fill {
  height: 100%;
  border-radius: 3px;
  width: 0%;
  transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}

.match-bar-fill.programmer { background: var(--accent); }
.match-bar-fill.writer { background: var(--pink); }
.match-bar-fill.scholar { background: var(--green); }

.match-item.winner .match-item-name {
  color: var(--accent);
  font-weight: 700;
}

.match-item.winner .match-item-score {
  color: var(--accent);
}

/* 角色切换动画 */
@keyframes cardFlip {
  0% { transform: rotateY(0deg); }
  50% { transform: rotateY(90deg); }
  100% { transform: rotateY(0deg); }
}

.card-flip {
  animation: cardFlip 0.5s ease-in-out;
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateX(12px); }
  to { opacity: 1; transform: translateX(0); }
}

.fade-slide-in {
  animation: fadeSlideIn 0.35s ease-out;
}

/* ===== 滚动条美化 ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>
</head>
<body>

<!-- 顶部导航栏 -->
<nav class="navbar">
  <span class="navbar-brand">🧚 Memora</span>
  <a href="index.html" class="navbar-link">← 返回主页</a>
</nav>

<!-- 主布局 -->
<div class="main-container">

  <!-- 左侧：对话界面 -->
  <div class="chat-panel">
    <div class="chat-header">
      <h2>对话演示</h2>
      <p>输入消息，观察角色自动匹配过程</p>
    </div>

    <!-- 消息列表 -->
    <div class="chat-messages" id="chatMessages">
      <div class="message message-system">角色系统已就绪，等待输入...</div>
    </div>

    <!-- 输入区域 -->
    <div class="chat-input-area">
      <!-- 预设示例按钮 -->
      <div class="example-buttons">
        <button class="example-btn" onclick="sendExample('帮我写一段 Python 代码')">帮我写一段 Python 代码</button>
        <button class="example-btn" onclick="sendExample('我正在写一部科幻小说')">我正在写一部科幻小说</button>
        <button class="example-btn" onclick="sendExample('帮我复习一下机器学习的知识点')">帮我复习一下机器学习的知识点</button>
      </div>
      <!-- 输入框 -->
      <div class="chat-input-row">
        <input type="text" class="chat-input" id="chatInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMessage()">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
      </div>
    </div>
  </div>

  <!-- 右侧：角色面板 -->
  <div class="persona-panel">

    <!-- 当前角色卡片 -->
    <div class="current-persona-card" id="currentPersonaCard">
      <div class="current-persona-header">
        <span class="current-persona-icon" id="currentIcon">🧚</span>
        <div class="current-persona-info">
          <h3 id="currentName">默认精灵 <span class="mode-tag mode-auto">自动匹配</span></h3>
        </div>
      </div>
      <p class="current-persona-desc" id="currentDesc">尚未匹配角色，请发送消息触发自动匹配</p>
    </div>

    <!-- 角色列表 -->
    <div class="persona-list-title">可用角色</div>
    <div class="persona-list" id="personaList">
      <!-- 由 JS 动态生成 -->
    </div>

    <!-- 匹配过程可视化 -->
    <div class="match-section">
      <h3>匹配过程</h3>

      <!-- 分析中动画 -->
      <div class="analyzing-indicator" id="analyzingIndicator">
        <div class="analyzing-dots"><span></span><span></span><span></span></div>
        <span>正在分析输入...</span>
      </div>

      <!-- 匹配分数条 -->
      <div id="matchBars">
        <div class="match-item" id="match-programmer">
          <div class="match-item-header">
            <span class="match-item-name">🧑‍💻 程序员</span>
            <span class="match-item-score" id="score-programmer">0%</span>
          </div>
          <div class="match-bar-bg">
            <div class="match-bar-fill programmer" id="bar-programmer"></div>
          </div>
        </div>
        <div class="match-item" id="match-writer">
          <div class="match-item-header">
            <span class="match-item-name">✍️ 作家</span>
            <span class="match-item-score" id="score-writer">0%</span>
          </div>
          <div class="match-bar-bg">
            <div class="match-bar-fill writer" id="bar-writer"></div>
          </div>
        </div>
        <div class="match-item" id="match-scholar">
          <div class="match-item-header">
            <span class="match-item-name">📚 学者</span>
            <span class="match-item-score" id="score-scholar">0%</span>
          </div>
          <div class="match-bar-bg">
            <div class="match-bar-fill scholar" id="bar-scholar"></div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
/**
 * 角色系统演示 - 主逻辑
 * 模拟 Memora 的角色自动匹配和手动切换机制
 */

/* ===== 角色数据定义 ===== */
const personas = [
  {
    id: 'programmer',
    name: '程序员',
    icon: '🧑‍💻',
    desc: '擅长编程、调试、代码审查',
    keywords: ['代码', '编程', 'Python', 'JavaScript', '函数', 'bug', '调试', '开发', '程序', '写一段'],
    barClass: 'programmer',
    greeting: '你好！我是程序员角色，有什么代码问题需要我帮忙吗？'
  },
  {
    id: 'writer',
    name: '作家',
    icon: '✍️',
    desc: '擅长创作、写作、故事构思',
    keywords: ['小说', '写作', '故事', '创作', '科幻', '文学', '散文', '诗歌', '角色', '情节'],
    barClass: 'writer',
    greeting: '你好！我是作家角色，让我们一起构思精彩的故事吧！'
  },
  {
    id: 'scholar',
    name: '学者',
    icon: '📚',
    desc: '擅长学习、研究、知识整理',
    keywords: ['学习', '复习', '知识', '机器学习', '研究', '论文', '概念', '理论', '知识点'],
    barClass: 'scholar',
    greeting: '你好！我是学者角色，让我们一起来梳理知识体系吧！'
  }
];

/* ===== 状态变量 ===== */
let currentPersonaId = null;   // 当前激活的角色 ID
let isAnalyzing = false;       // 是否正在分析中

/* ===== 初始化 ===== */
function init() {
  renderPersonaList();
}

/**
 * 渲染角色列表卡片
 */
function renderPersonaList() {
  const list = document.getElementById('personaList');
  list.innerHTML = personas.map(p => `
    <div class="persona-card ${currentPersonaId === p.id ? 'active' : ''}" id="card-${p.id}" onclick="manualSwitch('${p.id}')">
      <div class="persona-card-icon">${p.icon}</div>
      <div class="persona-card-info">
        <h4>${p.name}</h4>
        <p>${p.desc}</p>
      </div>
    </div>
  `).join('');
}

/**
 * 发送预设示例消息
 * @param {string} text - 预设文本
 */
function sendExample(text) {
  document.getElementById('chatInput').value = text;
  sendMessage();
}

/**
 * 发送消息主流程
 */
function sendMessage() {
  if (isAnalyzing) return;

  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  /* 清空输入框并禁用发送按钮 */
  input.value = '';
  document.getElementById('sendBtn').disabled = true;

  /* 添加用户消息气泡 */
  addMessage(text, 'user');

  /* 开始匹配分析 */
  analyzeAndMatch(text);
}

/**
 * 添加消息到对话列表
 * @param {string} text - 消息文本
 * @param {string} type - 消息类型：user / sprite / system
 */
function addMessage(text, type) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `message message-${type}`;
  div.textContent = text;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

/**
 * 分析输入并匹配角色
 * @param {string} text - 用户输入文本
 */
function analyzeAndMatch(text) {
  isAnalyzing = true;

  /* 显示分析中动画 */
  const indicator = document.getElementById('analyzingIndicator');
  indicator.classList.add('visible');

  /* 清除之前的胜出状态 */
  document.querySelectorAll('.match-item').forEach(el => el.classList.remove('winner'));

  /* 计算每个角色的匹配分数 */
  const scores = personas.map(p => {
    const matchedKeywords = p.keywords.filter(kw => text.toLowerCase().includes(kw.toLowerCase()));
    /* 基础分 = 匹配关键词数 * 25，加上随机浮动模拟语义匹配 */
    const baseScore = matchedKeywords.length * 25;
    const randomBonus = Math.floor(Math.random() * 15);
    return {
      id: p.id,
      score: Math.min(baseScore + randomBonus, 100)
    };
  });

  /* 延迟动画：模拟分析过程 */
  setTimeout(() => {
    /* 更新分数条 */
    scores.forEach(s => {
      const bar = document.getElementById(`bar-${s.id}`);
      const scoreEl = document.getElementById(`score-${s.id}`);
      bar.style.width = s.score + '%';
      scoreEl.textContent = s.score + '%';
    });

    /* 找到最高分的角色 */
    const winner = scores.reduce((a, b) => a.score > b.score ? a : b);

    /* 延迟后高亮胜出角色并切换 */
    setTimeout(() => {
      indicator.classList.remove('visible');
      document.getElementById(`match-${winner.id}`).classList.add('winner');

      /* 如果分数大于 0，切换角色 */
      if (winner.score > 0) {
        switchPersona(winner.id, 'auto');
      }

      /* 精灵回复 */
      const matchedPersona = personas.find(p => p.id === winner.id);
      if (matchedPersona && winner.score > 0) {
        addMessage(matchedPersona.greeting, 'sprite');
      } else {
        addMessage('我还在学习你的偏好，你可以尝试更具体的描述，或者手动选择一个角色。', 'sprite');
      }

      isAnalyzing = false;
      document.getElementById('sendBtn').disabled = false;
    }, 600);
  }, 800);
}

/**
 * 切换角色（自动或手动）
 * @param {string} personaId - 角色 ID
 * @param {string} mode - 切换模式：auto / manual
 */
function switchPersona(personaId, mode) {
  if (currentPersonaId === personaId) return;

  const persona = personas.find(p => p.id === personaId);
  if (!persona) return;

  currentPersonaId = personaId;

  /* 更新当前角色卡片（带动画） */
  const card = document.getElementById('currentPersonaCard');
  card.classList.remove('card-flip');
  /* 触发重绘以重新播放动画 */
  void card.offsetWidth;
  card.classList.add('card-flip');

  document.getElementById('currentIcon').textContent = persona.icon;
  document.getElementById('currentName').innerHTML = `${persona.name} <span class="mode-tag ${mode === 'auto' ? 'mode-auto' : 'mode-manual'}">${mode === 'auto' ? '自动匹配' : '手动切换'}</span>`;
  document.getElementById('currentDesc').textContent = persona.desc;

  /* 更新角色列表高亮 */
  renderPersonaList();

  /* 添加系统消息 */
  if (mode === 'manual') {
    addMessage(`角色已切换为：${persona.icon} ${persona.name}（手动）`, 'system');
  }
}

/**
 * 手动切换角色
 * @param {string} personaId - 角色 ID
 */
function manualSwitch(personaId) {
  if (isAnalyzing) return;
  switchPersona(personaId, 'manual');
}

/* 页面加载后初始化 */
init();
</script>
</body>
</html>
