<!doctype html>
<!--
  Memora Demo · 小说创作 Web UI

  哲学：极简、专注、不打扰
  - 配置表单：清晰分组，错误状态友好
  - 聊天界面：流式输出，自动滚动
  - 4 层记忆面板：实时反映 working / bootstrap / archive / mounted
  - 配置存 localStorage，零后端状态
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memora · 小说创作 Demo</title>
    <style>
      /* ─── 极简变量 ─────────────────────────── */
      :root {
        --bg: #fafaf9;
        --bg-elev: #ffffff;
        --border: #e7e5e4;
        --text: #1c1917;
        --text-dim: #78716c;
        --accent: #0c4a6e;
        --accent-hover: #075985;
        --user-bubble: #0c4a6e;
        --agent-bubble: #f5f5f4;
        --error: #b91c1c;
        --success: #15803d;
        --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.08);
        --radius: 8px;
        /* 4 层记忆配色（蓝/绿/橙/紫） */
        --l1: #0c4a6e; /* working  深蓝 */
        --l2: #166534; /* bootstrap 绿 */
        --l3: #9a3412; /* archive 橙 */
        --l4: #6b21a8; /* mounted 紫 */
      }

      /* ─── 重置 ─────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
          sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.6;
      }

      /* ─── 布局（主区 + 记忆面板）──────────────── */
      #app {
        display: flex;
        flex-direction: row;
        height: 100vh;
        max-width: 1280px;
        margin: 0 auto;
      }
      #main-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #mem-col {
        width: 360px;
        border-left: 1px solid var(--border);
        background: var(--bg-elev);
        display: flex;
        flex-direction: column;
        transition: width 0.3s ease;
      }
      #mem-col.hidden {
        width: 0;
        border-left: none;
        overflow: hidden;
      }

      /* ─── 头部 ─────────────────────────────── */
      header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-elev);
      }
      header h1 {
        font-size: 18px;
        font-weight: 600;
        color: var(--accent);
      }
      header .subtitle {
        font-size: 12px;
        color: var(--text-dim);
        margin-top: 4px;
      }
      header .status {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        margin-left: 8px;
      }
      .status.mock {
        background: #fef3c7;
        color: #92400e;
      }
      .status.live {
        background: #d1fae5;
        color: #065f46;
      }

      /* ─── 配置区（可折叠）─────────────────── */
      #config-panel {
        border-bottom: 1px solid var(--border);
        background: var(--bg-elev);
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
      }
      #config-panel.open {
        max-height: 400px;
      }
      .config-inner {
        padding: 20px 24px;
      }
      .config-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
      }
      .config-grid label {
        display: block;
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 4px;
      }
      .config-grid input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 13px;
        font-family: inherit;
      }
      .config-grid input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(12, 74, 110, 0.1);
      }
      .config-actions {
        margin-top: 12px;
        display: flex;
        gap: 8px;
      }

      /* ─── 对话区 ──────────────────────────── */
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .message {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: var(--radius);
        word-wrap: break-word;
        white-space: pre-wrap;
      }
      .message.user {
        align-self: flex-end;
        background: var(--user-bubble);
        color: white;
      }
      .message.agent {
        align-self: flex-start;
        background: var(--agent-bubble);
        border: 1px solid var(--border);
      }
      .message.system {
        align-self: center;
        background: transparent;
        color: var(--text-dim);
        font-size: 12px;
        font-style: italic;
      }
      .message.error {
        align-self: center;
        background: #fee2e2;
        color: var(--error);
        border: 1px solid #fecaca;
      }
      /* ─── 思考中反馈 ──────────────────────── */
      .thinking-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-dim);
        font-size: 13px;
        padding: 4px 0;
      }
      .thinking-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--text-dim);
        animation: think-bounce 1.4s infinite ease-in-out both;
      }
      .thinking-dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .thinking-dot:nth-child(2) {
        animation-delay: -0.16s;
      }
      @keyframes think-bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
          opacity: 0.3;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
      /* ─── 操作步骤面板（可折叠）────────────── */
      .action-steps {
        margin-top: 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg);
        overflow: hidden;
      }
      .action-steps-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 12px;
        color: var(--text-dim);
        user-select: none;
      }
      .action-steps-head:hover {
        background: var(--agent-bubble);
      }
      .action-steps-head .arrow {
        transition: transform 0.2s;
        font-size: 10px;
      }
      .action-steps.collapsed .arrow {
        transform: rotate(-90deg);
      }
      .action-steps.collapsed .action-step {
        display: none;
      }
      .action-step {
        padding: 6px 12px 6px 28px;
        font-size: 12px;
        color: var(--text);
        border-top: 1px solid var(--border);
        position: relative;
      }
      .action-step::before {
        content: '';
        position: absolute;
        left: 12px;
        top: 12px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .action-step.writing::before {
        background: var(--l2);
      }
      .action-step.tool::before {
        background: var(--l4);
      }
      .action-step.recall::before {
        background: var(--l3);
      }
      .action-step.done::before {
        background: var(--success);
      }
      .action-step.done {
        color: var(--success);
      }

      /* ─── 输入区 ──────────────────────────── */
      #input-bar {
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        background: var(--bg-elev);
        display: flex;
        gap: 8px;
      }
      #input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 14px;
        font-family: inherit;
        resize: none;
        max-height: 120px;
      }
      #input:focus {
        outline: none;
        border-color: var(--accent);
      }
      button {
        padding: 8px 16px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.secondary {
        background: transparent;
        color: var(--text-dim);
        border: 1px solid var(--border);
      }
      button.secondary:hover:not(:disabled) {
        background: var(--bg);
      }

      /* ─── 工具栏 ──────────────────────────── */
      .toolbar {
        display: flex;
        gap: 8px;
        padding: 8px 24px;
        background: var(--bg-elev);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
      }
      .toolbar a {
        color: var(--text-dim);
        text-decoration: none;
        cursor: pointer;
      }
      .toolbar a:hover {
        color: var(--accent);
      }
      .toolbar a.active {
        color: var(--accent);
        font-weight: 600;
      }

      /* ─── 记忆面板 ─────────────────────────── */
      .mem-head {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .mem-head h2 {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
      }
      .mem-head .ts {
        font-size: 11px;
        color: var(--text-dim);
        font-family: ui-monospace, 'SF Mono', monospace;
      }
      .mem-body {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .mem-card {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fdfdfc;
        overflow: hidden;
      }
      .mem-card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 10px;
        background: #f5f5f4;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
      }
      .mem-card-head .title {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
      }
      .mem-card-head .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .mem-card-head .count {
        font-size: 11px;
        color: var(--text-dim);
        font-family: ui-monospace, monospace;
      }
      .mem-card-body {
        padding: 8px 10px;
        max-height: 180px;
        overflow-y: auto;
        font-size: 11.5px;
        line-height: 1.5;
      }
      .mem-card-body:empty::before {
        content: '（无）';
        color: var(--text-dim);
        font-style: italic;
      }
      .mem-item {
        padding: 4px 0;
        border-bottom: 1px dashed #e7e5e4;
        word-wrap: break-word;
      }
      .mem-item:last-child {
        border-bottom: none;
      }
      .mem-item .role {
        display: inline-block;
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 3px;
        background: var(--bg);
        color: var(--text-dim);
        margin-right: 4px;
        font-family: ui-monospace, monospace;
      }
      .mem-item .role.user {
        background: #dbeafe;
        color: #1e40af;
      }
      .mem-item .role.assistant {
        background: #fce7f3;
        color: #9d174d;
      }
      .mem-item .role.system {
        background: #e0e7ff;
        color: #3730a3;
      }
      .mem-item .role.tool {
        background: #fef3c7;
        color: #92400e;
      }
      .mem-item .name {
        font-weight: 600;
        color: var(--text);
      }
      .mem-item .meta {
        color: var(--text-dim);
        font-size: 10.5px;
        font-family: ui-monospace, monospace;
      }
      .mem-item .preview {
        color: var(--text-dim);
        font-size: 11px;
        margin-top: 2px;
      }
      /* 4 层色彩 */
      .l1 .dot {
        background: var(--l1);
      }
      .l1 .title {
        color: var(--l1);
      }
      .l2 .dot {
        background: var(--l2);
      }
      .l2 .title {
        color: var(--l2);
      }
      .l3 .dot {
        background: var(--l3);
      }
      .l3 .title {
        color: var(--l3);
      }
      .l4 .dot {
        background: var(--l4);
      }
      .l4 .title {
        color: var(--l4);
      }

      .mem-hint {
        padding: 16px;
        text-align: center;
        color: var(--text-dim);
        font-size: 12px;
      }

      /* ─── 章节管理面板 ──────────────────────── */
      .novel-panel {
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        max-height: 40%;
        overflow: hidden;
      }
      .novel-panel-head {
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--bg-elev);
        cursor: pointer;
        user-select: none;
      }
      .novel-panel-head h3 {
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
      }
      .novel-panel-head .badge {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 3px;
        background: var(--bg);
        color: var(--text-dim);
        font-family: ui-monospace, monospace;
      }
      .novel-panel-body {
        flex: 1;
        overflow-y: auto;
        padding: 8px 12px;
        font-size: 12px;
      }
      .novel-item {
        padding: 6px 8px;
        border-radius: 4px;
        margin-bottom: 4px;
        cursor: default;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .novel-item:hover {
        background: var(--bg);
      }
      .novel-item .icon {
        font-size: 14px;
      }
      .novel-item .label {
        flex: 1;
        word-break: break-all;
      }
      .novel-empty {
        color: var(--text-dim);
        font-style: italic;
        text-align: center;
        padding: 16px 0;
        font-size: 11px;
      }

      /* ─── 步骤折叠（工具调用反馈） ─── */
      .steps-container {
        margin: 8px 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        font-size: 12px;
      }
      .step-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        user-select: none;
        transition: background 0.15s;
      }
      .step-item:last-child {
        border-bottom: none;
      }
      .step-item:hover {
        background: var(--bg-card);
      }
      .step-icon {
        flex-shrink: 0;
        width: 18px;
        text-align: center;
      }
      .step-label {
        color: var(--text-dim);
      }
      .step-name {
        font-weight: 500;
        color: var(--accent);
      }
      .step-ok {
        color: #4ade80;
      }
      .step-err {
        color: #f87171;
      }
      .step-summary {
        display: none;
        padding: 4px 10px 8px 36px;
        color: var(--text-dim);
        font-size: 11px;
        background: var(--bg-card);
        border-bottom: 1px solid var(--border);
      }
      .step-item.open + .step-summary {
        display: block;
      }
      .step-item.open {
        background: var(--bg-card);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 左侧：聊天主区 -->
      <div id="main-col">
        <header>
          <h1>墨羽 · 小说创作搭档 <span id="status" class="status mock">Mock</span></h1>
          <div class="subtitle">Memora Agent · 真实可跑的"宿主项目接入"示例</div>
        </header>

        <div class="toolbar">
          <a onclick="toggleConfig()">⚙ 配置 LLM</a>
          <a id="mem-toggle" onclick="toggleMemPanel()">📚 4 层记忆</a>
          <a onclick="clearChat()">🗑 清空对话</a>
        </div>

        <div id="config-panel">
          <div class="config-inner">
            <div class="config-grid">
              <div>
                <label>API Key</label>
                <input id="cfg-key" type="password" placeholder="mimo-..." />
              </div>
              <div>
                <label>Base URL</label>
                <input id="cfg-base" placeholder="https://api.xiaomimimo.com/v1" />
              </div>
              <div>
                <label>Model</label>
                <input id="cfg-model" placeholder="mimo-v2.5-pro" />
              </div>
            </div>
            <div class="config-actions">
              <button onclick="saveConfig()">保存</button>
              <button class="secondary" onclick="toggleConfig()">取消</button>
              <span
                id="config-msg"
                style="font-size: 12px; color: var(--text-dim); align-self: center"
              ></span>
            </div>
          </div>
        </div>

        <div id="messages">
          <div class="message system">
            欢迎使用墨羽。默认运行在 Mock 模式——点 "⚙ 配置 LLM" 填入 mimo API Key 启用真实对话。
          </div>
        </div>

        <div id="input-bar">
          <textarea
            id="input"
            rows="1"
            placeholder="输入消息…（Shift+Enter 换行，Enter 发送）"
            onkeydown="handleKey(event)"
          ></textarea>
          <button id="send-btn" onclick="sendMessage()">发送</button>
        </div>
      </div>

      <!-- 右侧：4 层记忆面板 + 小说面板 -->
      <div id="mem-col" class="hidden">
        <div class="mem-head">
          <h2>4 层记忆快照</h2>
          <span class="ts" id="mem-ts">--:--:--</span>
        </div>
        <div class="mem-body" id="mem-body">
          <div class="mem-hint">Agent 未启动——发条消息后会自动刷新</div>
        </div>

        <!-- 章节管理面板 -->
        <div class="novel-panel" id="chapters-panel">
          <div class="novel-panel-head" onclick="refreshChapters()">
            <h3>📖 章节</h3>
            <span class="badge" id="chapters-count">0</span>
          </div>
          <div class="novel-panel-body" id="chapters-body">
            <div class="novel-empty">暂无章节——让墨羽帮你创建</div>
          </div>
        </div>

        <!-- 角色卡片面板 -->
        <div class="novel-panel" id="characters-panel">
          <div class="novel-panel-head" onclick="refreshCharacters()">
            <h3>🎭 角色</h3>
            <span class="badge" id="characters-count">0</span>
          </div>
          <div class="novel-panel-body" id="characters-body">
            <div class="novel-empty">暂无角色——让墨羽帮你设定</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ─── 配置管理 ────────────────────────────
      const CONFIG_KEY = 'memora-demo-config';

      function loadConfig() {
        try {
          return JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}');
        } catch {
          return {};
        }
      }

      function saveConfig() {
        const cfg = {
          apiKey: document.getElementById('cfg-key').value.trim(),
          baseUrl: document.getElementById('cfg-base').value.trim(),
          model: document.getElementById('cfg-model').value.trim(),
        };
        localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
        document.getElementById('config-msg').textContent = '已保存';
        updateStatus();
        setTimeout(() => {
          document.getElementById('config-msg').textContent = '';
          toggleConfig();
        }, 800);
      }

      function toggleConfig() {
        const panel = document.getElementById('config-panel');
        const cfg = loadConfig();
        document.getElementById('cfg-key').value = cfg.apiKey || '';
        document.getElementById('cfg-base').value = cfg.baseUrl || 'https://api.xiaomimimo.com/v1';
        document.getElementById('cfg-model').value = cfg.model || 'mimo-v2.5-pro';
        panel.classList.toggle('open');
      }

      function updateStatus() {
        const cfg = loadConfig();
        const status = document.getElementById('status');
        if (cfg.apiKey) {
          status.textContent = '真实 LLM';
          status.className = 'status live';
        } else {
          status.textContent = 'Mock';
          status.className = 'status mock';
        }
      }

      // ─── 对话 ────────────────────────────────
      function appendMessage(role, content) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = content;
        document.getElementById('messages').appendChild(div);
        scrollToBottom();
        return div;
      }

      function scrollToBottom() {
        const msgs = document.getElementById('messages');
        msgs.scrollTop = msgs.scrollHeight;
      }

      function clearChat() {
        document.getElementById('messages').innerHTML = '';
        appendMessage('system', '对话已清空。');
      }

      // ─── 4 层记忆面板 ─────────────────────────
      let memPanelOpen = false;
      let memRefreshTimer = null;

      function toggleMemPanel() {
        const col = document.getElementById('mem-col');
        const toggle = document.getElementById('mem-toggle');
        memPanelOpen = !memPanelOpen;
        col.classList.toggle('hidden', !memPanelOpen);
        toggle.classList.toggle('active', memPanelOpen);
        if (memPanelOpen) {
          // 立即拉取一次 + 启动定时刷新
          refreshMemoryPanel();
          memRefreshTimer = setInterval(refreshMemoryPanel, 4000);
        } else if (memRefreshTimer) {
          clearInterval(memRefreshTimer);
          memRefreshTimer = null;
        }
      }

      /**
       * 拉取并渲染 4 层记忆快照
       * 数据来源：GET /api/inspect（详见 web.ts §/api/inspect）
       */
      async function refreshMemoryPanel() {
        try {
          const res = await fetch('/api/inspect');
          const data = await res.json();
          document.getElementById('mem-ts').textContent = formatTs(data.timestamp);
          renderMemoryPanel(data);
        } catch (err) {
          document.getElementById('mem-body').innerHTML =
            `<div class="mem-hint">⚠ 拉取失败：${err.message}</div>`;
        }
      }

      /**
       * 渲染 4 张记忆卡片
       * @param data /api/inspect 返回值
       */
      function renderMemoryPanel(data) {
        const body = document.getElementById('mem-body');
        if (!data.ready) {
          body.innerHTML = `<div class="mem-hint">${escapeHtml(data.reason || '等待 Agent 启动…')}</div>`;
          return;
        }

        const cards = [
          renderL1Working(data.working),
          renderL2Bootstrap(data.bootstrap),
          renderL3Archive(data.archive),
          renderL4Mounted(data.mounted),
        ];

        body.innerHTML = cards.join('');
      }

      /** 第 1 层：工作记忆 */
      function renderL1Working(w) {
        const items = (w.preview || [])
          .map(
            (m) => `
        <div class="mem-item">
          <span class="role ${m.role}">${m.role}</span>
          <span class="preview">${escapeHtml(m.contentPreview)}${m.contentLength > 80 ? '…' : ''}</span>
          <div class="meta">${m.contentLength} 字符</div>
        </div>
      `,
          )
          .join('');
        return `
        <div class="mem-card l1">
          <div class="mem-card-head">
            <div class="title"><span class="dot"></span>① 工作记忆</div>
            <div class="count">total=${w.total}</div>
          </div>
          <div class="mem-card-body">${items}</div>
        </div>
      `;
      }

      /** 第 2 层：Bootstrap 记忆 */
      function renderL2Bootstrap(b) {
        const items = (b.items || [])
          .map(
            (m) => `
        <div class="mem-item">
          <span class="role">${m.type}</span>
          <span class="name">${escapeHtml(m.name)}</span>
          <div class="meta">${m.permanence} · weight=${m.weight.toFixed(2)}</div>
          <div class="preview">${escapeHtml(m.contentPreview)}…</div>
        </div>
      `,
          )
          .join('');
        return `
        <div class="mem-card l2">
          <div class="mem-card-head">
            <div class="title"><span class="dot"></span>② Bootstrap</div>
            <div class="count">total=${b.total}</div>
          </div>
          <div class="mem-card-body">${items}</div>
        </div>
      `;
      }

      /** 第 3 层：话题归档 */
      function renderL3Archive(a) {
        const files = (a.topicFiles || [])
          .map(
            (f) => `
        <div class="mem-item">
          <span class="name">📄 ${escapeHtml(f)}</span>
        </div>
      `,
          )
          .join('');
        return `
        <div class="mem-card l3">
          <div class="mem-card-head">
            <div class="title"><span class="dot"></span>③ 话题归档</div>
            <div class="count">files=${a.topicFilesCount}</div>
          </div>
          <div class="mem-card-body">
            <div class="meta" style="margin-bottom:6px;">当前话题：<b>${escapeHtml(a.currentTopic)}</b></div>
            ${files}
          </div>
        </div>
      `;
      }

      /** 第 4 层：话题挂载 */
      function renderL4Mounted(m) {
        const items = (m.items || [])
          .map(
            (it) => `
        <div class="mem-item">
          <span class="name">${escapeHtml(it.name)}</span>
          <div class="meta">weight=${it.weight.toFixed(2)}</div>
          <div class="preview">${escapeHtml(it.contentPreview)}…</div>
        </div>
      `,
          )
          .join('');
        const flag = m.isMounted ? '🟢 mounted' : '⚪ unmounted';
        return `
        <div class="mem-card l4">
          <div class="mem-card-head">
            <div class="title"><span class="dot"></span>④ 话题挂载</div>
            <div class="count">${flag} · total=${m.total}</div>
          </div>
          <div class="mem-card-body">${items}</div>
        </div>
      `;
      }

      function formatTs(iso) {
        if (!iso) return '--:--:--';
        const d = new Date(iso);
        return d.toLocaleTimeString('zh-CN', { hour12: false });
      }

      function escapeHtml(s) {
        return String(s || '').replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c],
        );
      }

      // ─── 发送消息 ────────────────────────────
      /**
       * 发送用户消息到后端，流式接收回复
       *
       * 反馈设计（不碰核心库，纯前端）：
       * 1. 思考阶段：显示跳动的三点动画 + "思考中..."
       * 2. 输出阶段：收到第一个内容字符后切换到正常文本流
       * 3. 操作追踪：正则匹配 LLM 回复中的工具调用模式，记录到操作步骤
       * 4. 完成后：在消息下方追加可折叠的「操作步骤」面板
       */
      async function sendMessage() {
        const input = document.getElementById('input');
        const text = input.value.trim();
        if (!text) return;

        const cfg = loadConfig();
        const sendBtn = document.getElementById('send-btn');
        sendBtn.disabled = true;
        input.value = '';

        // 用户消息气泡
        appendMessage('user', text);

        // Agent 消息容器（含思考指示器）
        const msgContainer = document.createElement('div');
        msgContainer.className = 'message agent';
        msgContainer.style.position = 'relative';

        // 思考中指示器（粉色文字，白色背景）
        const thinkingEl = document.createElement('div');
        thinkingEl.className = 'thinking-indicator';
        thinkingEl.innerHTML =
          '<span style="color:#db2777;margin-right:2px;">思考中</span>' +
          '<span class="thinking-dot"></span>' +
          '<span class="thinking-dot"></span>' +
          '<span class="thinking-dot"></span>';
        msgContainer.appendChild(thinkingEl);

        document.getElementById('messages').appendChild(msgContainer);
        scrollToBottom();

        // 操作步骤收集器
        const actionSteps = [];
        let firstContent = true;
        let outputText = '';

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, config: cfg }),
          });

          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              const data = line.slice(6);
              if (data === '[DONE]') continue;
              try {
                const chunk = JSON.parse(data);

                // ─── 按 AgentChunk.type 分支处理 ───
                if (chunk.error) {
                  // 错误事件
                  removeThinking(msgContainer, thinkingEl);
                  msgContainer.textContent = '错误：' + chunk.error;
                  msgContainer.className = 'message error';
                } else if (chunk.type === 'recall') {
                  // 记忆召回事件：更新思考指示器
                  thinkingEl.querySelector('span').textContent = `召回 ${chunk.count} 条记忆`;
                  actionSteps.push({
                    key: `recall:${actionSteps.length}`,
                    type: 'recall',
                    label: `召回了 ${chunk.count} 条相关记忆`,
                  });
                } else if (chunk.type === 'text') {
                  // 文本输出事件：流式追加到气泡
                  outputText += chunk.content;
                  if (firstContent) {
                    firstContent = false;
                    removeThinking(msgContainer, thinkingEl);
                  }
                  const lastChild = msgContainer.lastChild;
                  if (
                    lastChild &&
                    lastChild !== thinkingEl &&
                    lastChild.nodeType === Node.TEXT_NODE
                  ) {
                    lastChild.textContent += chunk.content;
                  } else {
                    msgContainer.appendChild(document.createTextNode(chunk.content));
                  }
                } else if (chunk.type === 'tool_start') {
                  // 工具开始执行：更新思考指示器 + 记录步骤
                  if (firstContent) {
                    thinkingEl.querySelector('span').textContent = `正在执行 ${chunk.name}...`;
                  }
                  actionSteps.push({
                    key: `tool:${actionSteps.length}`,
                    type: 'tool',
                    label: `调用工具：${chunk.name}`,
                  });
                } else if (chunk.type === 'tool_result') {
                  // 工具执行完成：记录步骤
                  const status = chunk.ok ? '成功' : '失败';
                  actionSteps.push({
                    key: `result:${actionSteps.length}`,
                    type: chunk.ok ? 'writing' : 'tool',
                    label: `${chunk.name} ${status}${chunk.summary ? '：' + chunk.summary.slice(0, 60) : ''}`,
                  });
                } else if (chunk.type === 'done') {
                  // 本轮结束
                  if (firstContent) {
                    // 没有收到任何文本内容（可能 LLM 超时）
                    removeThinking(msgContainer, thinkingEl);
                    msgContainer.textContent = '（未收到回复）';
                  }
                  actionSteps.push({
                    key: 'done',
                    type: 'done',
                    label: '回复完成',
                  });
                }
              } catch {
                /* 忽略解析失败 */
              }
            }
            scrollToBottom();
          }

          // 完成后追加操作步骤面板
          appendActionSteps(msgContainer, actionSteps);

          // 刷新记忆面板 + 小说面板
          if (memPanelOpen) {
            refreshMemoryPanel();
            refreshChapters();
            refreshCharacters();
          }
        } catch (err) {
          removeThinking(msgContainer, thinkingEl);
          msgContainer.textContent = '请求失败：' + err.message;
          msgContainer.className = 'message error';
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      }

      /** 移除思考指示器 */
      function removeThinking(container, thinkingEl) {
        if (thinkingEl.parentNode === container) {
          container.removeChild(thinkingEl);
        }
      }

      /**
       * 在消息气泡下方追加可折叠的操作步骤面板
       */
      function appendActionSteps(container, steps) {
        if (steps.length === 0) return;
        const panel = document.createElement('div');
        panel.className = 'action-steps collapsed';
        panel.innerHTML =
          `<div class="action-steps-head" onclick="toggleActionSteps(this)">
            <span>操作步骤（${steps.length} 步）</span>
            <span class="arrow">&#9660;</span>
          </div>` +
          steps.map((s) => `<div class="action-step ${s.type}">${s.label}</div>`).join('');
        container.appendChild(panel);
      }

      /** 切换操作步骤面板的折叠状态 */
      function toggleActionSteps(head) {
        head.parentElement.classList.toggle('collapsed');
      }

      function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      }

      /**
       * 页面加载时恢复历史消息
       *
       * 从 /api/messages 拉取 AgentLoop 内部的对话记录，
       * 重新渲染为聊天气泡。覆盖"页面刷新"场景：
       * - 服务端 agent 还在内存中 → 完整恢复
       * - 服务重启后 → 仅恢复 system prompt（用户看到空对话，符合预期）
       */
      async function restoreMessages() {
        try {
          const res = await fetch('/api/messages');
          const data = await res.json();
          if (data.messages && data.messages.length > 0) {
            // 清掉默认的欢迎消息
            document.getElementById('messages').innerHTML = '';
            // 逐条渲染历史消息
            for (const m of data.messages) {
              if (m.role === 'user' || m.role === 'assistant') {
                appendMessage(m.role, m.content);
              } else if (m.role === 'tool') {
                // tool 消息用 system 样式显示（不占主对话流）
                appendMessage(
                  'system',
                  `[工具结果] ${m.content.slice(0, 200)}${m.content.length > 200 ? '…' : ''}`,
                );
              }
            }
          }
        } catch {
          // 恢复失败不影响正常使用，静默忽略
        }
      }

      // ─── 启动 ───────────────────────────────
      updateStatus();
      // 页面加载时恢复历史消息（解决刷新后对话消失的问题）
      restoreMessages();

      // ─── 章节管理面板（R-509）────────────────────
      async function refreshChapters() {
        try {
          const res = await fetch('/api/chapters');
          const data = await res.json();
          const body = document.getElementById('chapters-body');
          const badge = document.getElementById('chapters-count');
          badge.textContent = String(data.chapters.length);
          if (data.chapters.length === 0) {
            body.innerHTML = '<div class="novel-empty">暂无章节——让墨羽帮你创建</div>';
          } else {
            body.innerHTML = data.chapters
              .map(
                (name) =>
                  `<div class="novel-item"><span class="icon">📄</span><span class="label">${escapeHtml(name)}</span></div>`,
              )
              .join('');
          }
        } catch {
          // 静默失败
        }
      }

      // ─── 角色卡片面板（R-509）────────────────────
      async function refreshCharacters() {
        try {
          const res = await fetch('/api/characters');
          const data = await res.json();
          const body = document.getElementById('characters-body');
          const badge = document.getElementById('characters-count');
          badge.textContent = String(data.characters.length);
          if (data.characters.length === 0) {
            body.innerHTML = '<div class="novel-empty">暂无角色——让墨羽帮你设定</div>';
          } else {
            body.innerHTML = data.characters
              .map(
                (name) =>
                  `<div class="novel-item"><span class="icon">🎭</span><span class="label">${escapeHtml(name.replace('.md', ''))}</span></div>`,
              )
              .join('');
          }
        } catch {
          // 静默失败
        }
      }
    </script>
  </body>
</html>
