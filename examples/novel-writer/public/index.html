<!doctype html>
<!--
  Memora Demo · 小说创作 Web UI

  哲学：极简、专注、不打扰
  - 配置表单：清晰分组，错误状态友好
  - 聊天界面：流式输出，自动滚动
  - 4 层记忆面板：实时反映 working / bootstrap / archive / mounted
  - 配置存 localStorage，零后端状态
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memora · 小说创作 Demo</title>
    <style>
      /* ─── 极简变量 ─────────────────────────── */
      :root {
        --bg: #fafaf9;
        --bg-elev: #ffffff;
        --border: #e7e5e4;
        --text: #1c1917;
        --text-dim: #78716c;
        --accent: #0c4a6e;
        --accent-hover: #075985;
        --user-bubble: #0c4a6e;
        --agent-bubble: #f5f5f4;
        --error: #b91c1c;
        --success: #15803d;
        --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.08);
        --radius: 8px;
        /* 4 层记忆配色（蓝/绿/橙/紫） */
        --l1: #0c4a6e; /* working  深蓝 */
        --l2: #166534; /* bootstrap 绿 */
        --l3: #9a3412; /* archive 橙 */
        --l4: #6b21a8; /* mounted 紫 */
      }

      /* ─── 重置 ─────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
          sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.6;
      }

      /* ─── 布局（主区 + 记忆面板）──────────────── */
      #app {
        display: flex;
        flex-direction: row;
        height: 100vh;
        max-width: 1280px;
        margin: 0 auto;
      }
      #main-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #mem-col {
        width: 360px;
        border-left: 1px solid var(--border);
        background: var(--bg-elev);
        display: flex;
        flex-direction: column;
        transition: width 0.3s ease;
      }
      #mem-col.hidden {
        width: 0;
        border-left: none;
        overflow: hidden;
      }

      /* ─── 头部 ─────────────────────────────── */
      header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-elev);
      }
      header h1 {
        font-size: 18px;
        font-weight: 600;
        color: var(--accent);
      }
      header .subtitle {
        font-size: 12px;
        color: var(--text-dim);
        margin-top: 4px;
      }
      header .status {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        margin-left: 8px;
      }
      .status.mock {
        background: #fef3c7;
        color: #92400e;
      }
      .status.live {
        background: #d1fae5;
        color: #065f46;
      }

      /* ─── 配置区（可折叠）─────────────────── */
      #config-panel {
        border-bottom: 1px solid var(--border);
        background: var(--bg-elev);
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
      }
      #config-panel.open {
        max-height: 400px;
      }
      .config-inner {
        padding: 20px 24px;
      }
      .config-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
      }
      .config-grid label {
        display: block;
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 4px;
      }
      .config-grid input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 13px;
        font-family: inherit;
      }
      .config-grid input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(12, 74, 110, 0.1);
      }
      .config-actions {
        margin-top: 12px;
        display: flex;
        gap: 8px;
      }

      /* ─── 对话区 ──────────────────────────── */
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .message {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: var(--radius);
        word-wrap: break-word;
        white-space: pre-wrap;
      }
      .message.user {
        align-self: flex-end;
        background: var(--user-bubble);
        color: white;
      }
      .message.agent {
        align-self: flex-start;
        background: var(--agent-bubble);
        border: 1px solid var(--border);
      }
      .message.system {
        align-self: center;
        background: transparent;
        color: var(--text-dim);
        font-size: 12px;
        font-style: italic;
      }
      .message.error {
        align-self: center;
        background: #fee2e2;
        color: var(--error);
        border: 1px solid #fecaca;
      }

      /* ─── 输入区 ──────────────────────────── */
      #input-bar {
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        background: var(--bg-elev);
        display: flex;
        gap: 8px;
      }
      #input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 14px;
        font-family: inherit;
        resize: none;
        max-height: 120px;
      }
      #input:focus {
        outline: none;
        border-color: var(--accent);
      }
      button {
        padding: 8px 16px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.secondary {
        background: transparent;
        color: var(--text-dim);
        border: 1px solid var(--border);
      }
      button.secondary:hover:not(:disabled) {
        background: var(--bg);
      }

      /* ─── 工具栏 ──────────────────────────── */
      .toolbar {
        display: flex;
        gap: 8px;
        padding: 8px 24px;
        background: var(--bg-elev);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
      }
      .toolbar a {
        color: var(--text-dim);
        text-decoration: none;
        cursor: pointer;
      }
      .toolbar a:hover {
        color: var(--accent);
      }
      .toolbar a.active {
        color: var(--accent);
        font-weight: 600;
      }

      /* ─── 记忆面板 ─────────────────────────── */
      .mem-head {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .mem-head h2 {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
      }
      .mem-head .ts {
        font-size: 11px;
        color: var(--text-dim);
        font-family: ui-monospace, 'SF Mono', monospace;
      }
      .mem-body {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .mem-card {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fdfdfc;
        overflow: hidden;
      }
      .mem-card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 10px;
        background: #f5f5f4;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
      }
      .mem-card-head .title {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
      }
      .mem-card-head .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .mem-card-head .count {
        font-size: 11px;
        color: var(--text-dim);
        font-family: ui-monospace, monospace;
      }
      .mem-card-body {
        padding: 8px 10px;
        max-height: 180px;
        overflow-y: auto;
        font-size: 11.5px;
        line-height: 1.5;
      }
      .mem-card-body:empty::before {
        content: '（无）';
        color: var(--text-dim);
        font-style: italic;
      }
      .mem-item {
        padding: 4px 0;
        border-bottom: 1px dashed #e7e5e4;
        word-wrap: break-word;
      }
      .mem-item:last-child {
        border-bottom: none;
      }
      .mem-item .role {
        display: inline-block;
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 3px;
        background: var(--bg);
        color: var(--text-dim);
        margin-right: 4px;
        font-family: ui-monospace, monospace;
      }
      .mem-item .role.user {
        background: #dbeafe;
        color: #1e40af;
      }
      .mem-item .role.assistant {
        background: #fce7f3;
        color: #9d174d;
      }
      .mem-item .role.system {
        background: #e0e7ff;
        color: #3730a3;
      }
      .mem-item .role.tool {
        background: #fef3c7;
        color: #92400e;
      }
      .mem-item .name {
        font-weight: 600;
        color: var(--text);
      }
      .mem-item .meta {
        color: var(--text-dim);
        font-size: 10.5px;
        font-family: ui-monospace, monospace;
      }
      .mem-item .preview {
        color: var(--text-dim);
        font-size: 11px;
        margin-top: 2px;
      }
      /* 4 层色彩 */
      .l1 .dot {
        background: var(--l1);
      }
      .l1 .title {
        color: var(--l1);
      }
      .l2 .dot {
        background: var(--l2);
      }
      .l2 .title {
        color: var(--l2);
      }
      .l3 .dot {
        background: var(--l3);
      }
      .l3 .title {
        color: var(--l3);
      }
      .l4 .dot {
        background: var(--l4);
      }
      .l4 .title {
        color: var(--l4);
      }

      .mem-hint {
        padding: 16px;
        text-align: center;
        color: var(--text-dim);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 左侧：聊天主区 -->
      <div id="main-col">
        <header>
          <h1>墨羽 · 小说创作搭档 <span id="status" class="status mock">Mock</span></h1>
          <div class="subtitle">Memora Agent · 真实可跑的"宿主项目接入"示例</div>
        </header>

        <div class="toolbar">
          <a onclick="toggleConfig()">⚙ 配置 LLM</a>
          <a id="mem-toggle" onclick="toggleMemPanel()">📚 4 层记忆</a>
          <a onclick="clearChat()">🗑 清空对话</a>
        </div>

        <div id="config-panel">
          <div class="config-inner">
            <div class="config-grid">
              <div>
                <label>API Key</label>
                <input id="cfg-key" type="password" placeholder="mimo-..." />
              </div>
              <div>
                <label>Base URL</label>
                <input id="cfg-base" placeholder="https://api.xiaomimimo.com/v1" />
              </div>
              <div>
                <label>Model</label>
                <input id="cfg-model" placeholder="mimo-v2.5-pro" />
              </div>
            </div>
            <div class="config-actions">
              <button onclick="saveConfig()">保存</button>
              <button class="secondary" onclick="toggleConfig()">取消</button>
              <span
                id="config-msg"
                style="font-size: 12px; color: var(--text-dim); align-self: center"
              ></span>
            </div>
          </div>
        </div>

        <div id="messages">
          <div class="message system">
            欢迎使用墨羽。默认运行在 Mock 模式——点 "⚙ 配置 LLM" 填入 mimo API Key 启用真实对话。
          </div>
        </div>

        <div id="input-bar">
          <textarea
            id="input"
            rows="1"
            placeholder="输入消息…（Shift+Enter 换行，Enter 发送）"
            onkeydown="handleKey(event)"
          ></textarea>
          <button id="send-btn" onclick="sendMessage()">发送</button>
        </div>
      </div>

      <!-- 右侧：4 层记忆面板 -->
      <div id="mem-col" class="hidden">
        <div class="mem-head">
          <h2>4 层记忆快照</h2>
          <span class="ts" id="mem-ts">--:--:--</span>
        </div>
        <div class="mem-body" id="mem-body">
          <div class="mem-hint">Agent 未启动——发条消息后会自动刷新</div>
        </div>
      </div>
    </div>

    <script>
      // ─── 配置管理 ────────────────────────────
      const CONFIG_KEY = 'memora-demo-config';

      function loadConfig() {
        try {
          return JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}');
        } catch {
          return {};
        }
      }

      function saveConfig() {
        const cfg = {
          apiKey: document.getElementById('cfg-key').value.trim(),
          baseUrl: document.getElementById('cfg-base').value.trim(),
          model: document.getElementById('cfg-model').value.trim(),
        };
        localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
        document.getElementById('config-msg').textContent = '已保存';
        updateStatus();
        setTimeout(() => {
          document.getElementById('config-msg').textContent = '';
          toggleConfig();
        }, 800);
      }

      function toggleConfig() {
        const panel = document.getElementById('config-panel');
        const cfg = loadConfig();
        document.getElementById('cfg-key').value = cfg.apiKey || '';
        document.getElementById('cfg-base').value = cfg.baseUrl || 'https://api.xiaomimimo.com/v1';
        document.getElementById('cfg-model').value = cfg.model || 'mimo-v2.5-pro';
        panel.classList.toggle('open');
      }

      function updateStatus() {
        const cfg = loadConfig();
        const status = document.getElementById('status');
        if (cfg.apiKey) {
          status.textContent = '真实 LLM';
          status.className = 'status live';
        } else {
          status.textContent = 'Mock';
          status.className = 'status mock';
        }
      }

      // ─── 对话 ────────────────────────────────
      function appendMessage(role, content) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = content;
        document.getElementById('messages').appendChild(div);
        scrollToBottom();
        return div;
      }

      function scrollToBottom() {
        const msgs = document.getElementById('messages');
        msgs.scrollTop = msgs.scrollHeight;
      }

      function clearChat() {
        document.getElementById('messages').innerHTML = '';
        appendMessage('system', '对话已清空。');
      }

      // ─── 4 层记忆面板 ─────────────────────────
      let memPanelOpen = false;
      let memRefreshTimer = null;

      function toggleMemPanel() {
        const col = document.getElementById('mem-col');
        const toggle = document.getElementById('mem-toggle');
        memPanelOpen = !memPanelOpen;
        col.classList.toggle('hidden', !memPanelOpen);
        toggle.classList.toggle('active', memPanelOpen);
        if (memPanelOpen) {
          // 立即拉取一次 + 启动定时刷新
          refreshMemoryPanel();
          memRefreshTimer = setInterval(refreshMemoryPanel, 4000);
        } else if (memRefreshTimer) {
          clearInterval(memRefreshTimer);
          memRefreshTimer = null;
        }
      }

      /**
       * 拉取并渲染 4 层记忆快照
       * 数据来源：GET /api/inspect（详见 web.ts §/api/inspect）
       */
      async function refreshMemoryPanel() {
        try {
          const res = await fetch('/api/inspect');
          const data = await res.json();
          document.getElementById('mem-ts').textContent = formatTs(data.timestamp);
          renderMemoryPanel(data);
        } catch (err) {
          document.getElementById('mem-body').innerHTML =
            `<div class="mem-hint">⚠ 拉取失败：${err.message}</div>`;
        }
      }

      /**
       * 渲染 4 张记忆卡片
       * @param data /api/inspect 返回值
       */
      function renderMemoryPanel(data) {
        const body = document.getElementById('mem-body');
        if (!data.ready) {
          body.innerHTML = `<div class="mem-hint">${escapeHtml(data.reason || '等待 Agent 启动…')}</div>`;
          return;
        }

        const cards = [
          renderL1Working(data.working),
          renderL2Bootstrap(data.bootstrap),
          renderL3Archive(data.archive),
          renderL4Mounted(data.mounted),
        ];

        body.innerHTML = cards.join('');
      }

      /** 第 1 层：工作记忆 */
      function renderL1Working(w) {
        const items = (w.preview || [])
          .map(
            (m) => `
        <div class="mem-item">
          <span class="role ${m.role}">${m.role}</span>
          <span class="preview">${escapeHtml(m.contentPreview)}${m.contentLength > 80 ? '…' : ''}</span>
          <div class="meta">${m.contentLength} 字符</div>
        </div>
      `,
          )
          .join('');
        return `
        <div class="mem-card l1">
          <div class="mem-card-head">
            <div class="title"><span class="dot"></span>① 工作记忆</div>
            <div class="count">total=${w.total}</div>
          </div>
          <div class="mem-card-body">${items}</div>
        </div>
      `;
      }

      /** 第 2 层：Bootstrap 记忆 */
      function renderL2Bootstrap(b) {
        const items = (b.items || [])
          .map(
            (m) => `
        <div class="mem-item">
          <span class="role">${m.type}</span>
          <span class="name">${escapeHtml(m.name)}</span>
          <div class="meta">${m.permanence} · weight=${m.weight.toFixed(2)}</div>
          <div class="preview">${escapeHtml(m.contentPreview)}…</div>
        </div>
      `,
          )
          .join('');
        return `
        <div class="mem-card l2">
          <div class="mem-card-head">
            <div class="title"><span class="dot"></span>② Bootstrap</div>
            <div class="count">total=${b.total}</div>
          </div>
          <div class="mem-card-body">${items}</div>
        </div>
      `;
      }

      /** 第 3 层：话题归档 */
      function renderL3Archive(a) {
        const files = (a.topicFiles || [])
          .map(
            (f) => `
        <div class="mem-item">
          <span class="name">📄 ${escapeHtml(f)}</span>
        </div>
      `,
          )
          .join('');
        return `
        <div class="mem-card l3">
          <div class="mem-card-head">
            <div class="title"><span class="dot"></span>③ 话题归档</div>
            <div class="count">files=${a.topicFilesCount}</div>
          </div>
          <div class="mem-card-body">
            <div class="meta" style="margin-bottom:6px;">当前话题：<b>${escapeHtml(a.currentTopic)}</b></div>
            ${files}
          </div>
        </div>
      `;
      }

      /** 第 4 层：话题挂载 */
      function renderL4Mounted(m) {
        const items = (m.items || [])
          .map(
            (it) => `
        <div class="mem-item">
          <span class="name">${escapeHtml(it.name)}</span>
          <div class="meta">weight=${it.weight.toFixed(2)}</div>
          <div class="preview">${escapeHtml(it.contentPreview)}…</div>
        </div>
      `,
          )
          .join('');
        const flag = m.isMounted ? '🟢 mounted' : '⚪ unmounted';
        return `
        <div class="mem-card l4">
          <div class="mem-card-head">
            <div class="title"><span class="dot"></span>④ 话题挂载</div>
            <div class="count">${flag} · total=${m.total}</div>
          </div>
          <div class="mem-card-body">${items}</div>
        </div>
      `;
      }

      function formatTs(iso) {
        if (!iso) return '--:--:--';
        const d = new Date(iso);
        return d.toLocaleTimeString('zh-CN', { hour12: false });
      }

      function escapeHtml(s) {
        return String(s || '').replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c],
        );
      }

      // ─── 发送消息 ────────────────────────────
      async function sendMessage() {
        const input = document.getElementById('input');
        const text = input.value.trim();
        if (!text) return;

        const cfg = loadConfig();
        const sendBtn = document.getElementById('send-btn');
        sendBtn.disabled = true;
        input.value = '';

        appendMessage('user', text);
        const agentBubble = appendMessage('agent', '');

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, config: cfg }),
          });

          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              const data = line.slice(6);
              if (data === '[DONE]') continue;
              try {
                const parsed = JSON.parse(data);
                if (parsed.error) {
                  agentBubble.textContent = '错误：' + parsed.error;
                  agentBubble.className = 'message error';
                } else if (parsed.content) {
                  agentBubble.textContent += parsed.content;
                }
              } catch {
                /* 忽略解析失败 */
              }
            }
            scrollToBottom();
          }
          // 消息发完后立即刷新一次记忆面板
          if (memPanelOpen) refreshMemoryPanel();
        } catch (err) {
          agentBubble.textContent = '请求失败：' + err.message;
          agentBubble.className = 'message error';
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      }

      function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      }

      // ─── 启动 ────────────────────────────────
      updateStatus();
    </script>
